<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>아레나</title>
<meta name="description" content="방어덱을 걸어 두고, 다른 소환사의 방어덱을 골라 싸워요.">
<style>
:root{--gold:#f2c75c;--gold2:#b8862b;--gold3:#6b4a12;--wood:#3a2616;--wood2:#241508;--panel:#2b1a0e;--ink:#fff4dc;--ink2:#d9c39a;--ink3:#9a8560;--blue:#4aa3ff;--green:#5fd45f;--red:#ff5a4a;--orange:#ff8a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0a12}
body{color:var(--ink);font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
#fight{z-index:10}
.scene{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.hidden{display:none!important}
.bg-lobby{background-image:url(img/bg/lobby.jpg?v=2)}
.bg-arena{background-image:url(img/bg/arena.jpg?v=2)}
.bg-dungeon{background-image:url(img/bg/dungeon.jpg?v=2)}
.scene::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.45))}
/* 공통 버튼 */
.gb{position:relative;border:2px solid #5a3b10;border-radius:12px;background:linear-gradient(180deg,#ffd978,#e0a030 55%,#c47f16);color:#3a2000;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 3px 0 #6b4512,0 6px 14px rgba(0,0,0,.45);padding:12px 18px;font-size:17px;letter-spacing:-.3px}
.gb:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4512}
.gb.orange{background:linear-gradient(180deg,#ffb45c,#ff7f1f 55%,#d85a08);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);border-color:#7a3808}
.gb.green{background:linear-gradient(180deg,#b8ec6a,#78c53a 55%,#4d9a1c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);border-color:#2d5f0c}
.gb.wood{background:linear-gradient(180deg,#8a6236,#5a3a1a);color:var(--ink);border-color:#2a1808;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.gb:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.gb .badge{position:absolute;top:-10px;right:-10px;background:#e2302a;color:#fff;border:2px solid #fff;border-radius:999px;min-width:26px;height:26px;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px}
/* 상단 HUD */
.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;padding-top:max(10px,env(safe-area-inset-top))}
.tabs{display:flex;gap:6px}
.tab{height:40px;padding:0 14px;border-radius:10px;border:2px solid #3a2a12;background:linear-gradient(180deg,#5a4426,#2a1a08);color:#c9b48a;font-weight:800;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tab.on{background:linear-gradient(180deg,#2a2114,#0f0a04);color:var(--gold);border-color:var(--gold2);box-shadow:0 0 0 2px #0c0803,0 0 12px rgba(242,199,92,.35)}
.me{text-align:right;font-size:13px;color:var(--ink);text-shadow:0 1px 3px #000;line-height:1.5}
.me b{font-size:15px;color:var(--gold)}
.me .ro{display:flex;gap:10px;justify-content:flex-end;font-weight:800}
/* 로비 */
.stage{position:absolute;left:0;right:0;bottom:17%;height:38%;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding:0 26% 0 6%}
.stage .u{position:relative;width:26%;max-width:190px;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
.stage .u img,.stage .u svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.stage .u .nm{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000;color:var(--ink)}
.stage .u.empty{border:2px dashed rgba(255,244,220,.35);border-radius:14px;aspect-ratio:1/0.9;color:rgba(255,244,220,.55);font-size:12px;align-items:center}
.stage .lead{position:absolute;left:14px;bottom:-54px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--gold);text-shadow:0 1px 2px #000;background:rgba(0,0,0,.45);border:1px solid var(--gold2);border-radius:6px;padding:2px 8px}
.sidebtn{position:absolute;right:12px;top:42%;width:34%;max-width:220px;display:flex;flex-direction:column;gap:14px;z-index:4}
.sidebtn .gb{font-size:20px;padding:18px 10px}
.bbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:5}
.bbar .ib{width:72px;height:66px;border-radius:12px;border:2px solid #3a2a12;background:linear-gradient(180deg,#f0c060,#a86f1c);color:#2a1800;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #5a3a0c,0 6px 10px rgba(0,0,0,.4);text-decoration:none}
.bbar .ib i{font-style:normal;font-size:24px;line-height:1}
.bbar .ib.back{background:linear-gradient(180deg,#b8ec6a,#4d9a1c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.timer{position:absolute;right:14px;top:72px;text-align:right;font-size:12px;color:var(--ink2);text-shadow:0 1px 2px #000;z-index:4}
/* 모달 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.frame{position:relative;width:100%;max-width:720px;max-height:96%;background:linear-gradient(180deg,#3e2814,#2a1a0c);border:3px solid #a67a2e;outline:2px solid #3a2410;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,220,140,.15);display:flex;flex-direction:column}
.frame .ttl{position:absolute;left:50%;top:-16px;transform:translateX(-50%);background:linear-gradient(180deg,#c59a4a,#8a5f1e);border:2px solid #4a2e0a;border-radius:8px;padding:4px 28px;font-weight:900;font-size:18px;color:#2a1800;white-space:nowrap}
.frame .ttl::before,.frame .ttl::after{content:"◆";color:#5a3a0c;font-size:10px;margin:0 8px;vertical-align:middle}
.frame .x{position:absolute;right:-8px;top:-14px;width:40px;height:40px;border-radius:9px;border:2px solid #4a2e0a;background:linear-gradient(180deg,#f0c060,#a86f1c);font-weight:900;font-size:18px;color:#2a1800;z-index:2}
.frame .body{display:flex;gap:10px;padding:26px 12px 12px;min-height:0;flex:1}
.ltabs{display:flex;flex-direction:column;gap:8px;width:88px;flex:none}
.ltabs button{position:relative;border:2px solid #3a2410;border-radius:8px;background:linear-gradient(180deg,#5a4426,#2a1a08);color:#c9b48a;font-weight:800;font-size:13px;padding:11px 4px}
.ltabs button.on{background:linear-gradient(180deg,#d8a84a,#9a6a1c);color:#2a1800}
.ltabs .badge{position:absolute;top:-8px;right:-8px;background:#e2302a;color:#fff;border:2px solid #fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chip{border:2px solid #3a2410;border-radius:8px;background:linear-gradient(180deg,#3a2a14,#1c1008);color:var(--gold);font-weight:800;font-size:13px;padding:8px 12px}
.chip.btn{background:linear-gradient(180deg,#5a4426,#2a1a08);color:var(--ink)}
.chip.btn:disabled{color:var(--ink3);cursor:default}
.rows{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.rw{display:grid;grid-template-columns:60px 1fr auto auto;gap:10px;align-items:center;background:linear-gradient(90deg,#8f6a2e,#d9b35c 40%,#c7a04a);border:2px solid #5a3a10;border-radius:8px;padding:6px 8px;color:#2a1800;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.rw.beat{background:linear-gradient(90deg,#7a5a2a,#a88a46 40%,#9a7c3a)}
.rw .av{width:60px;height:60px;border-radius:8px;background:#1d130a;border:2px solid #5a3a10;position:relative;overflow:hidden}
.rw .av img,.rw .av svg{width:100%;height:100%;object-fit:contain}
.rw .av .st{position:absolute;left:-2px;bottom:-2px;background:#f2c75c;border:2px solid #5a3a10;border-radius:999px;width:20px;height:20px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rw .inf{min-width:0}
.rw .inf b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .inf small{font-size:12px;color:#4a3410;font-weight:700}
.rw .pw{font-weight:900;font-size:18px;white-space:nowrap}
.rw .pw small{font-size:12px;font-weight:800;color:#4a3410;margin-right:3px}
.rw .gb{padding:8px 14px;font-size:15px;min-width:76px}
.rw .won{min-width:76px;text-align:center;font-weight:900;font-size:16px;color:#2a1800;background:linear-gradient(180deg,#ffe49a,#e0b040);border:2px solid #5a3b10;border-radius:10px;padding:8px 6px}
.rw .rec{font-size:12px;font-weight:800;color:#4a3410;text-align:right;line-height:1.3}
/* 대전 준비 */
.setup{position:absolute;inset:0;background:rgba(10,6,3,.92);z-index:15;display:flex;flex-direction:column;padding:12px;padding-top:max(12px,env(safe-area-inset-top));gap:10px}
.setup .top{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:14px}
.setup .top b{color:var(--gold);font-size:18px}
.vsbox{border:2px solid #a67a2e;border-radius:10px;background:linear-gradient(180deg,#2a1a0c,#1a1006);padding:12px 8px;display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:6px;flex:none}
.vsbox .vs{text-align:center;font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(242,199,92,.6)}
.vsbox .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.vsbox .side .lab{font-size:12px;font-weight:800;color:var(--ink2)}
.vsbox .side .lab.me{color:var(--blue)} .vsbox .side .lab.op{color:var(--gold)}
.tri{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pt{position:relative;width:72px;height:72px;border-radius:10px;border:3px solid #2e4e8a;background:#101a30;overflow:hidden;cursor:pointer;flex:none}
.pt.op{border-color:#b8862b;background:#2a1a08}
.pt.empty{border-color:#3a2a14;background:#1a1208;display:flex;align-items:center;justify-content:center;color:#5a4a2a;font-size:26px;cursor:default}
.pt img,.pt svg{width:100%;height:100%;object-fit:contain;display:block}
.pt .st{position:absolute;right:3px;bottom:2px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.pt .stars{position:absolute;left:3px;top:2px;font-size:9px;letter-spacing:-1px;color:#ff5ec8;text-shadow:0 0 2px #000}
.pt .el{position:absolute;left:2px;bottom:2px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.6);font-size:12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25)}
.pt .ld{position:absolute;right:-2px;top:-2px;background:var(--gold);color:#2a1800;font-size:9px;font-weight:900;padding:0 4px;border-radius:0 0 0 6px}
.roster{flex:1;min-height:0;border:2px solid #3a2410;border-radius:10px;background:#120c06;padding:8px;overflow:auto}
.roster .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.roster .pt.on{box-shadow:0 0 0 3px var(--gold),0 0 14px rgba(242,199,92,.6)}
.roster .pt.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 6px #000;background:rgba(0,0,0,.25)}
.roster .pt .i{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4);z-index:2}
.setup .acts{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap}
.setup .acts .gb{flex:1;padding:14px 10px;font-size:17px}
.modes{display:flex;gap:4px;width:100%}
.modes button{flex:1;border:2px solid #3a2410;border-radius:8px;background:#1a1208;color:var(--ink3);font-size:12.5px;font-weight:800;padding:8px 4px}
.modes button.on{background:linear-gradient(180deg,#d8a84a,#9a6a1c);color:#2a1800}
/* 상세 팝업 */
.detail{position:absolute;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.detail .frame{max-width:560px;padding:0}
.detail .dbody{padding:32px 14px 16px;display:grid;grid-template-columns:1fr 64px;gap:10px;min-height:0;overflow:auto}
.detail .art{position:relative;height:240px;display:flex;align-items:flex-end;justify-content:center}
.detail .art img,.detail .art svg{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6))}
.detail .stars{position:absolute;left:0;top:0;font-size:16px;color:#ff5ec8;text-shadow:0 0 3px #000;letter-spacing:-1px}
.detail .ty{position:absolute;left:0;bottom:0;color:var(--ink2);font-size:14px;font-weight:800}
.detail .st{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:16px;font-weight:800;margin-top:10px;color:var(--ink2)}
.detail .st span{color:var(--ink);font-variant-numeric:tabular-nums}
.detail .ttl b{color:#ffb640}
.sks{display:flex;flex-direction:column;gap:8px;align-items:center}
.sk{width:58px;height:58px;border-radius:10px;border:2px solid #a67a2e;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;background:radial-gradient(circle at 40% 35%,#6a5a2a,#1c1208);box-shadow:inset 0 0 10px rgba(0,0,0,.6);cursor:pointer;flex:none}
.sk.port{padding:2px;overflow:hidden} .sk.port img,.sk.port svg{width:100%;height:100%;object-fit:contain}
.sk .t{position:absolute;right:2px;top:1px;font-size:10px;font-weight:900;color:var(--gold);text-shadow:0 0 3px #000}
.sk.fire{background:radial-gradient(circle at 40% 35%,#ff9a3a,#7a1a00)} .sk.water{background:radial-gradient(circle at 40% 35%,#5ec8ff,#0a2a6a)} .sk.earth{background:radial-gradient(circle at 40% 35%,#c9a060,#4a2c08)} .sk.wind{background:radial-gradient(circle at 40% 35%,#a8f0b0,#0e5a2a)} .sk.light{background:radial-gradient(circle at 40% 35%,#fff6c0,#9a7a10)} .sk.dark{background:radial-gradient(circle at 40% 35%,#9a60e0,#1a0a3a)}
.sk.on{box-shadow:0 0 0 3px var(--gold),0 0 14px rgba(242,199,92,.6)}
.tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,460px);background:rgba(20,12,6,.96);border:2px solid #a67a2e;border-radius:10px;padding:12px 14px;z-index:40;color:var(--ink);font-size:14px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tip b{display:block;text-align:center;font-size:18px;color:#ffb640;margin-bottom:6px}
.tip .cd{color:var(--ink3);font-size:12.5px;margin-top:4px}
/* 전투 */
.field{position:absolute;inset:0}
.unit{position:absolute;width:19%;max-width:150px;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:opacity .4s}
.unit .bars{width:100%;position:relative;margin-bottom:4px}
.unit .lv{position:absolute;left:-12px;top:-6px;width:30px;height:30px;border-radius:999px;background:radial-gradient(circle at 40% 35%,#fff,#d8d8e0);border:2px solid #333;color:#2a1800;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.unit.b .lv{background:radial-gradient(circle at 40% 35%,#c9a0ff,#6a2ac0);color:#fff;border-color:#2a0a5a}
.unit .hp{height:9px;background:#1a1a1a;border:1.5px solid #222;border-radius:4px;margin-left:12px;overflow:hidden}
.unit .hp i{display:block;height:100%;background:linear-gradient(180deg,#9cff6a,#36b321);transition:width .3s}
.unit .hp i.low{background:linear-gradient(180deg,#ff9a6a,#d83a1a)}
.unit .tg{height:4px;background:#1a1a1a;border:1px solid #222;border-top:none;border-radius:0 0 4px 4px;margin-left:12px;overflow:hidden}
.unit .tg i{display:block;height:100%;background:linear-gradient(90deg,#4ae0ff,#2a80ff);transition:width .2s}
.unit .im{width:100%;aspect-ratio:1;position:relative}
.unit .im img,.unit .im svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.55))}
.unit.b .im img,.unit.b .im svg{transform:scaleX(-1)}
.unit.down{opacity:.25;filter:grayscale(1)}
.unit.hit .im{animation:shake .3s}
.unit.act .im::after{content:"";position:absolute;left:10%;right:10%;bottom:-4%;height:16%;border-radius:50%;background:radial-gradient(ellipse,rgba(242,199,92,.9),rgba(242,199,92,0) 70%)}
.unit .arrow{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:28px;color:#ffb020;text-shadow:0 2px 3px #000;animation:bob 1s infinite;display:none;z-index:3}
.unit.tgt .arrow{display:block}
.unit.cantgt{cursor:pointer}
.unit .effs{position:absolute;left:0;right:0;bottom:-2px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;pointer-events:none}
.unit .effs span{font-size:9.5px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid #c33;color:#ffb0a0}
.unit .effs span.good{border-color:#3c3;color:#b0ffb0}
.unit .nm{font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;white-space:nowrap;margin-top:12px}
.fl{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:24px;color:#fff;text-shadow:0 0 4px #000,0 2px 2px #000,0 0 10px rgba(255,80,40,.8);animation:fl 1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
.fl.heal{text-shadow:0 0 4px #000,0 2px 2px #000,0 0 10px rgba(80,255,80,.8);color:#c0ffc0}
.fl.miss{font-size:16px;color:#ddd}
.fl.eff{font-size:14px;color:#ffd080;top:50%}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.cap{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.55);border:1px solid rgba(242,199,92,.4);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--ink);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:6}
.ctl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.ctl button{width:58px;height:58px;border-radius:12px;border:2px solid #cfcfcf;background:rgba(255,255,255,.92);color:#222;font-weight:900;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.ctl button.on{background:#ffd040;border-color:#8a6010}
.ctl .k{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;background:#222;color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap}
.skbar{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.skbar .sk{width:66px;height:66px;font-size:28px;border-width:3px;border-color:#f0c060;background:radial-gradient(circle at 40% 35%,#ffe080,#a06a10);box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.3)}
.skbar .sk.ready{box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,220,100,.9)}
.skbar .sk.cd{filter:grayscale(.8) brightness(.6)}

<script src="game.js?v=27"></script>
<script>
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
const UNDEAD=new Set(["스켈레톤","유령","뱀파이어","임프"]);
const HOLY=new Set(["빛의 심판","심판"]);
const MAGICAL=new Set(["mana","divine","spirit"]);
const BAD=new Set(["stun","sleep","web","burn","bleed","poison","frost","shock","slow","silence","blind","fear"]);
const TURN=240, MAXSPD=120;
let MODE="auto", SPD=1;
const GAME=new URLSearchParams(location.search).get("mode")==="dungeon"?"dungeon":"arena";
let FLOOR=1;
const MAXFLOOR=10;
const REFRESH_MS=10*60*1000; // 리스트 갱신 쿨타임
function floorEnemyCount(f){return f<=2?1:f<=6?2:3}
function floorStage(f){return f<=3?1:f<=7?2:3}
function floorScale(f){return 1+0.10*(f-1)}
function floorReward(f){return f<=2?null:f<=6?"low":"high"}
function todayStr(){return new Date().toISOString().slice(0,10)}
function claimedToday(f){const c=rec().claimed||{};return c[f]===todayStr()}
const SKICON={hit:"⚔️",debuff:"🌀",buff:"🛡️",heal:"💚"};
const EFFICON={stun:"💫",sleep:"💤",web:"🕸️",burn:"🔥",bleed:"🩸",poison:"☠️",frost:"❄️",shock:"⚡",slow:"🐌",silence:"🔇",blind:"🌫️",fear:"😱",rage:"😡",shield:"🔰",guard:"🛡️",regen:"🌿",heal:"💚",cleanse:"✨",drain:"🧛",random:"🎲"};
function skIcon(s){return skImg(s.e,s.t)}
function nameOf(R,st){return R.stages[st-1].replace(/〔.*?〕/,"")}
function myNick(){try{const d=decode(localStorage.getItem("ssm_last")||"");return d&&d.nick||"소환사"}catch(e){return "소환사"}}
function col(){return collection()}
function makeMonster(floor,idx){
 const rr=rng(hash("dungeon"+Date.now()+Math.random()+idx));
 const b={y:String(1900+Math.floor(rr()*200)),m:String(1+Math.floor(rr()*12)),d:String(1+Math.floor(rr()*28)),h:String(Math.floor(rr()*12))};
 const keys=Object.keys(JOBS), a=Array.from({length:6},()=>keys[Math.floor(rr()*keys.length)]);
 const code=encode(b,a,"던전");
 const f=makeFighter({d:decode(code),h:code},floorStage(floor),"b",idx);
 const sc=floorScale(floor); f.base=f.base.map(v=>Math.round(v*sc)); f.st=f.base.slice(); f.maxhp=f.base[0]*10; f.hp=f.maxhp; f.owner="던전"; f.nick=""; f.code=null;
 return f;
}
function makeFighter(h,stage,side,idx){
 const R=judge(h.d.b,h.d.a);
 let st=stageStats(R.base,R.race,stage-1); let bonus=null;
 if(side==="a"){const cb=codexBonus(col()); if(cb.done.length){st=st.map((v,i)=>Math.round(v*cb.mult[i]));bonus=cb.done.join("·")}}
 const skills=R.skills.filter(([s])=>s<=stage).map(([s,k])=>({tier:s,n:k[0],t:k[1],m:k[2]*(1+0.2*(stage-s)),e:k[3],d:k[4],cd:0}));
 const nick=h.d.nick||"";
 return {code:h.h,bonus,side,idx,R,race:R.race,pow:R.pow,elem:R.elem,stage,nick,owner:nick||(side==="a"?"나":"상대"),name:nameOf(R,stage),st:st.slice(),base:st.slice(),maxhp:st[0]*10,hp:st[0]*10,skills,basic:BASIC[stage-1],eff:{},shield:0,guard:false,dot:{},gauge:0,turns:0};
}
function aff(att,def){return 1+(traitAdv(att,def)+elemAdv(att.elem,def.elem))/100}
function cur(f){
 let [hp,atk,mag,spd,def]=f.base;
 if(f.eff.fear)atk*=0.7; if(f.eff.rage){atk*=1.5;def*=0.8} if(f.eff.guard)def*=1.5;
 if(f.eff.shock)mag*=0.7; if(f.eff.slow)spd*=0.6; if(f.eff.frostslow)spd*=0.5;
 return [hp,atk,mag,spd,def];
}
function speed(f){return Math.min(MAXSPD,Math.round(cur(f)[3]*1.2))}
let TA=[], TB=[], ALL=[], rnd, BUSY=false, TARGET=null, LOGON=false;
const alive=t=>t.filter(f=>f.hp>0);
const uel=f=>$(`u_${f.side}${f.idx}`);
function float(f,text,cls){const el=uel(f);if(!el)return;const d=document.createElement("div");d.className="fl "+(cls||"");d.textContent=text;el.querySelector(".im").appendChild(d);setTimeout(()=>d.remove(),1000)}
function say(side,html,cls=""){
 const log=$("log"); const div=document.createElement("div"); div.className=cls==="r"?"r":"l"; div.innerHTML=html; log.appendChild(div); log.scrollTop=log.scrollHeight;
 if(cls!=="r")$("cap").innerHTML=html;
}
function dmgTo(att,def,raw,label,skill){
 if(def.eff.sleep){delete def.eff.sleep}
 let d=raw; if(def.guard)d*=(1-GUARD); if(def.shield>0){d*=0.5;def.shield--}
 d=Math.max(1,Math.floor(d)); def.hp=Math.max(0,def.hp-d);
 say(att.side,`<b>${att.name}</b> → ${def.name}에게 ${label}. <span class="dmg">-${d}</span>${skill?` <span class="eff">${skill}</span>`:""}${def.hp<=0?` <span class="eff">쓰러짐</span>`:""}`);
 const el=uel(def); if(el){el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),300)} float(def,"-"+d);
 return d;
}
function applyEff(att,def,e){
 if(!e)return;
 if(e==="random")e=["stun","burn","bleed","slow"][Math.floor(rnd()*4)];
 const name=EFF[e][0];
 if(e==="heal"){const v=Math.round(att.maxhp*0.3*(att.eff.bleed?0.5:1));att.hp=Math.min(att.maxhp,att.hp+v);say(att.side,`<b>${att.name}</b> 회복 <span class="heal">+${v}</span>`);float(att,"+"+v,"heal");return}
 if(e==="cleanse"){Object.keys(att.eff).forEach(k=>{if(BAD.has(k))delete att.eff[k]});say(att.side,`<b>${att.name}</b>의 나쁜 효과가 사라졌어요.`);float(att,"정화","eff");return}
 if(e==="shield"){att.shield=2;say(att.side,`<b>${att.name}</b>에게 보호막.`);float(att,"보호막","eff");return}
 if(e==="guard"){att.eff.guard=3;say(att.side,`<b>${att.name}</b> 방어 상승 3턴.`);float(att,"방어 상승","eff");return}
 if(e==="regen"){att.eff.regen=3;say(att.side,`<b>${att.name}</b> 재생 3턴.`);float(att,"재생","eff");return}
 if(e==="rage"){att.eff.rage=3;say(att.side,`<b>${att.name}</b> 광폭 3턴.`);float(att,"광폭","eff");return}
 if(e==="drain")return;
 if(["stun","sleep","frost"].includes(e)&&(def.eff.stun||def.eff.sleep||def.eff.frost))return;
 const dur={stun:1,sleep:2,web:2,burn:3,bleed:3,poison:4,frost:1,shock:2,slow:2,silence:2,blind:2,fear:2}[e];
 def.eff[e]=dur+1;
 if(e==="burn")def.dot.burn=Math.round(cur(att)[1]*0.3);
 say(att.side,`<span class="eff">→ ${def.name} ${name} ${dur}턴</span>`); setTimeout(()=>float(def,name,"eff"),250);
}
function startTurn(f){
 f.turns++;
 if(f.eff.burn){f.hp=Math.max(0,f.hp-f.dot.burn);say(f.side,`<b>${f.name}</b> 화상 <span class="dmg">-${f.dot.burn}</span>`);float(f,"-"+f.dot.burn)}
 if(f.eff.bleed){const v=Math.round(f.maxhp*0.05);f.hp=Math.max(0,f.hp-v);say(f.side,`<b>${f.name}</b> 출혈 <span class="dmg">-${v}</span>`);float(f,"-"+v)}
 if(f.eff.poison){const v=Math.round(f.maxhp*0.06);f.hp=Math.max(0,f.hp-v);say(f.side,`<b>${f.name}</b> 중독 <span class="dmg">-${v}</span>`);float(f,"-"+v)}
 if(f.eff.regen&&f.hp>0){const v=Math.round(f.maxhp*0.1*(f.eff.bleed?0.5:1));f.hp=Math.min(f.maxhp,f.hp+v);say(f.side,`<b>${f.name}</b> 재생 <span class="heal">+${v}</span>`);float(f,"+"+v,"heal")}
 f.skills.forEach(s=>{if(s.cd>0)s.cd--});
 if(f.hp<=0){say(f.side,`<b>${f.name}</b> 쓰러졌어요.`);return false}
 return true;
}
function endTurn(f){for(const k of Object.keys(f.eff)){f.eff[k]--; if(f.eff[k]<=0){delete f.eff[k]; if(k==="frost")f.eff.frostslow=3}}}
function cannotAct(att){
 if(att.eff.shock&&rnd()<0.3)return `<b>${att.name}</b> 감전으로 몸이 굳었어요.`;
 if(att.eff.stun)return `<b>${att.name}</b> 기절 중. 못 움직여요.`;
 if(att.eff.frost)return `<b>${att.name}</b> 얼어 있어요.`;
 if(att.eff.sleep)return `<b>${att.name}</b> 자고 있어요.`;
 return null;
}
function bestTarget(att,enemies){
 const score=e=>(traitAdv(att,e)+elemAdv(att.elem,e.elem))*10-(e.hp/e.maxhp);
 return alive(enemies).slice().sort((a,b)=>score(b)-score(a))[0];
}
function aiDecide(att,enemies){
 const target=bestTarget(att,enemies);
 const ready=att.skills.filter(s=>s.cd===0&&!att.eff.silence);
 const low=att.hp<att.maxhp*0.35;
 let pick=null;
 if(low)pick=ready.find(s=>s.t==="heal"||s.t==="buff");
 if(!pick){const h=ready.filter(s=>s.t==="hit"||s.t==="debuff").sort((a,b)=>b.tier-a.tier);pick=h[0]||null}
 if(!pick&&ready.length&&rnd()<0.5)pick=ready[0];
 if(!pick&&att.hp<att.maxhp*0.4&&rnd()<0.35)return {type:"guard"};
 return pick?{type:"skill",skill:pick,target:(pick.t==="hit"||pick.t==="debuff")?target:att}:{type:"basic",target};
}
function perform(att,action){
 att.guard=false;
 if(action.type==="guard"){att.guard=true;say(att.side,`<b>${att.name}</b> 방어 자세.`);float(att,"방어","eff");return}
 const def=action.target;
 const [,atk,mag]=cur(att), ddef=cur(def)[4];
 const useStat=(s)=>(s&&MAGICAL.has(att.pow))?mag:atk;
 const tryHit=(mult,label,eff,skill)=>{
  if(!def.eff.web&&rnd()<DODGE){say(att.side,`<b>${att.name}</b>의 ${label}. ${def.name}이(가) 피했어요.`);float(def,"회피","miss");return}
  if(att.eff.blind&&rnd()<0.5){say(att.side,`<b>${att.name}</b>의 ${label}. 앞이 안 보여 빗나갔어요.`);float(def,"빗나감","miss");return}
  let raw=useStat(skill)*mult*100/(100+ddef)*aff(att,def);
  if(skill&&HOLY.has(label)&&UNDEAD.has(def.race.n))raw*=2;
  const advp=traitAdv(att,def)+elemAdv(att.elem,def.elem);
  const d=dmgTo(att,def,raw,label,(skill?EFF[eff]?.[0]+" ":"")+(advp?`(${advp>0?"+":""}${advp}%)`:""));
  if(eff==="drain"){const v=Math.round(d*0.5*(att.eff.bleed?0.5:1));att.hp=Math.min(att.maxhp,att.hp+v);say(att.side,`<b>${att.name}</b> 흡혈 <span class="heal">+${v}</span>`);float(att,"+"+v,"heal")}
  else if(def.hp>0)applyEff(att,def,eff);
 };
 if(action.type==="skill"){
  const p=action.skill; p.cd=p.tier+1;
  if(p.t==="hit")tryHit(p.m,p.n,p.e,true);
  else{say(att.side,`<b>${att.name}</b>의 ${p.n}.`);applyEff(att,def,p.e)}
 }else tryHit(att.basic,"일반공격",null,false);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms/SPD));
function refresh(){ALL.forEach(f=>updateUnit(f))}
/* 수동 선택: 아래 스킬 버튼 + 적 터치로 대상 */
function askPlayer(att,enemies){
 return new Promise(res=>{
  const bar=$("skbar"); bar.classList.remove("hidden");
  TARGET=bestTarget(att,enemies); markTargets(enemies);
  const ready=att.skills.map(s=>({s,ok:s.cd===0&&!att.eff.silence}));
  const dmgOf=(s)=>showDmg(MAGICAL.has(att.pow)&&s?cur(att)[2]:cur(att)[1],s?s.m:att.basic);
  const done=(a)=>{bar.classList.add("hidden");clearTargets();$("tip").classList.add("hidden");res(a)};
  bar.innerHTML=`<div class="sk guard ready" data-k="guard">${skImg(null,"defend")}<span class="lb">방어</span></div><div class="sk ready" data-k="basic">${skImg(null,"hit")}<span class="lb">일반공격</span></div>`+
   ready.map(({s,ok},i)=>`<div class="sk ${ok?"ready":"cd"}" data-k="s${i}">${skIcon(s)}<span class="n">${s.tier}</span>${ok?"":`<span class="cdn">${s.cd}</span>`}<span class="lb">${s.n}</span></div>`).join("");
  const tipFor=(k)=>{
   if(k==="guard")return `<b>방어</b>이번 턴에 받는 피해가 ${GUARD*100}% 줄어요.`;
   if(k==="basic")return `<b>일반공격</b>적 하나를 때려요. 데미지 ${dmgOf(null)}.`;
   const {s,ok}=ready[+k.slice(1)];
   return `<b>${s.n}</b>${s.d||""}${s.t==="hit"?` 데미지 ${dmgOf(s)}.`:""}<div class="cd">${s.tier}단계 스킬 · 쿨타임 ${s.tier}턴${ok?"":" · "+s.cd+"턴 뒤 사용 가능"}${att.eff.silence?" · 침묵 중":""}</div>`;
  };
  bar.querySelectorAll(".sk").forEach(b=>{
   const k=b.dataset.k; let t;
   const showTip=()=>{const tip=$("tip");tip.innerHTML=tipFor(k);tip.classList.remove("hidden")};
   b.onmouseenter=showTip; b.onmouseleave=()=>$("tip").classList.add("hidden");
   b.ontouchstart=()=>{t=setTimeout(showTip,450)}; b.ontouchend=()=>clearTimeout(t);
   b.onclick=()=>{
    if(k==="guard")return done({type:"guard"});
    if(k==="basic")return done({type:"basic",target:TARGET});
    const {s,ok}=ready[+k.slice(1)];
    if(!ok){showTip();setTimeout(()=>$("tip").classList.add("hidden"),1600);return}
    if(s.t==="hit"||s.t==="debuff")return done({type:"skill",skill:s,target:TARGET});
    done({type:"skill",skill:s,target:att});
   };
  });
 });
}
function markTargets(enemies){alive(enemies).forEach(e=>{const el=uel(e);el.classList.add("cantgt");el.classList.toggle("tgt",e===TARGET);el.onclick=()=>{TARGET=e;alive(enemies).forEach(x=>uel(x).classList.toggle("tgt",x===e))}})}
function clearTargets(){ALL.forEach(f=>{const el=uel(f);if(el){el.classList.remove("cantgt","tgt");el.onclick=null}})}
/* 진행 */
async function loop(){
 let step=0;
 while(step<400&&alive(TA).length&&alive(TB).length){
  step++;
  alive(ALL).forEach(f=>f.gauge+=speed(f)); refresh(); await sleep(200);
  const ready=alive(ALL).filter(f=>f.gauge>=TURN).sort((a,b)=>b.gauge-a.gauge||rnd()-0.5);
  for(const f of ready){
   if(f.hp<=0)continue;
   const enemies=f.side==="a"?TB:TA; if(!alive(enemies).length)break;
   say(null,`${f.name} 차례`,"r"); f.gauge=0; refresh();
   ALL.forEach(x=>uel(x)?.classList.toggle("act",x===f));
   if(!startTurn(f)){refresh();continue}
   const no=cannotAct(f);
   if(no){say(f.side,no);endTurn(f);refresh();await sleep(500);continue}
   let action;
   if((MODE==="manual"&&f.side==="a")||MODE==="both"){refresh();action=await askPlayer(f,enemies)}
   else{await sleep(380);action=aiDecide(f,enemies)}
   perform(f,action); endTurn(f); refresh(); await sleep(520);
   ALL.forEach(x=>uel(x)?.classList.remove("act"));
   if(!alive(TA).length||!alive(TB).length)break;
  }
 }
 finish();
}
/* 전투 화면 */
function unitHTML(f){
 const n=(f.side==="a"?TA:TB).length, i=f.idx;
 const xs=n===1?[50]:n===2?[32,68]:[20,50,80];
 const x=xs[i], y=f.side==="a"?(n===3&&i===1?90:84):(n===3&&i===1?34:40);
 return `<div class="unit ${f.side}" id="u_${f.side}${f.idx}" style="left:${x}%;top:${y}%"><div class="arrow">⬇</div><div class="bars"><div class="lv">${f.stage}</div><div class="hp"><i style="width:100%"></i></div><div class="tg"><i style="width:0%"></i></div></div><div class="im">${artWithImage(f.race,f.stage,f.elem)}<div class="effs"></div></div><div class="nm">${f.name}</div></div>`;
}
function updateUnit(f){
 const el=uel(f); if(!el)return;
 const pct=Math.max(0,f.hp/f.maxhp*100), bar=el.querySelector(".hp i"); bar.style.width=pct+"%"; bar.classList.toggle("low",pct<30);
 el.classList.toggle("down",f.hp<=0);
 el.querySelector(".tg i").style.width=Math.min(100,f.gauge/TURN*100)+"%";
 el.querySelector(".effs").innerHTML=Object.keys(f.eff).filter(k=>EFF[k]).map(k=>`<span class="${BAD.has(k)?"":"good"}">${EFF[k][0]}</span>`).join("")+(f.shield>0?`<span class="good">보호막</span>`:"")+(f.guard?`<span class="good">방어</span>`:"");
}
function finish(){
 const ha=alive(TA).reduce((s,f)=>s+f.hp/f.maxhp,0), hb=alive(TB).reduce((s,f)=>s+f.hp/f.maxhp,0);
 let win=null; if(!alive(TA).length&&!alive(TB).length)win=null; else if(!alive(TA).length)win="b"; else if(!alive(TB).length)win="a"; else win=ha>=hb?"a":"b";
 const names=t=>t.map(f=>f.name).join("·");
 $("skbar").classList.add("hidden");
 let drop="", p="";
 if(GAME==="dungeon"){
  if(win==="a"){
   if((rec().dungeon||0)<FLOOR)setRec("dungeon",FLOOR);
   const kind=floorReward(FLOOR);
   if(!kind)p=`${FLOOR}층 통과. 3층부터 진화석이 나와요.`;
   else if(claimedToday(FLOOR))p=`${FLOOR}층 통과. 오늘 보상은 이미 받았어요.`;
   else{const c=rec().claimed||{};c[FLOOR]=todayStr();setRec("claimed",c);
    if(Math.random()<STONE_DROP){addItem(kind,1);drop=`<div class="drop"><img src="img/item_stone${kind==="low"?2:3}.png" alt="">${STONE[kind][0]} ×1</div>`}
    else{addItem(kind+"frag",1);drop=`<div class="drop"><img src="img/item_frag${kind==="low"?2:3}.png" alt="">${STONE[kind+"frag"][0]} ×1</div>`}}
  }else p=`${FLOOR}층 몬스터에게 졌어요.`;
 }else{
  if(win==="a"){setRec("wins",(rec().wins||0)+1);setRec("streak",(rec().streak||0)+1);if(CUR_OPPO)markBeaten(CUR_OPPO)}
  else if(win==="b"){setRec("losses",(rec().losses||0)+1);setRec("streak",0)}
  p=win==="a"?`${OPP_NAME}의 방어덱을 이겼어요.`:win==="b"?`${OPP_NAME}의 방어덱에 졌어요.`:"둘 다 쓰러졌어요.";
  addRecord({t:Date.now(),o:OPP_NAME,w:win==="a",a:names(TA),b:names(TB)});
 }
 $("r_h").textContent=win==="a"?"승리":win==="b"?"패배":"무승부"; $("r_h").classList.toggle("lose",win!=="a");
 $("r_p").textContent=p; $("r_drop").innerHTML=drop;
 $("r_next").classList.toggle("hidden",!(GAME==="dungeon"&&win==="a"&&FLOOR<MAXFLOOR));
 $("result").classList.remove("hidden");
 BUSY=false;
}
/* 기록·격파 */
function addRecord(r){const a=rec().log||[];a.unshift(r);setRec("log",a.slice(0,30))}
function listState(){let s={};try{s=JSON.parse(localStorage.getItem("ssm_arena")||"{}")}catch(e){}if(!s.seed){s={seed:String(Date.now()),t:Date.now(),beat:[]};saveList(s)}return s}
function saveList(s){try{localStorage.setItem("ssm_arena",JSON.stringify(s))}catch(e){}}
function markBeaten(key){const s=listState();if(!s.beat.includes(key))s.beat.push(key);saveList(s)}
function canRefresh(){return Date.now()-listState().t>=REFRESH_MS}
function refreshList(){saveList({seed:String(Date.now()),t:Date.now(),beat:[]});drawRows();toast("새 상대가 왔어요")}
const BOT_NAMES=["검은달","하루","도토리","미르","루나","태오","보라","설희","제이","민트","가온","수호"];
function botDecks(){
 const r=rng(hash("bots"+listState().seed));
 const keys=Object.keys(JOBS);
 return Array.from({length:8},(_,i)=>{
  const n=BOT_NAMES[Math.floor(r()*BOT_NAMES.length)]+String(Math.floor(r()*90)+10);
  const size=1+Math.floor(r()*3);
  const d=Array.from({length:size},()=>{const b={y:String(1900+Math.floor(r()*200)),m:String(1+Math.floor(r()*12)),d:String(1+Math.floor(r()*28)),h:String(Math.floor(r()*12))};const a=Array.from({length:6},()=>keys[Math.floor(r()*keys.length)]);const st=r()<0.5?1:r()<0.75?2:3;return [encode(b,a,n),st]});
  return {n,d,bot:true,key:"b"+i};
 });
}
function deckPower(d){return d.reduce((s,[c,st])=>{const dd=decode(c);const R=judge(dd.b,dd.a);return s+power(stageStats(R.base,R.race,st-1))},0)}
function drawAtk(){const a=arenaTickets();$("atk_n").textContent=a.n;$("atk_t").textContent=a.next?fmtT(a.next):"";if(!$("setup").classList.contains("hidden")&&!DEFMODE&&GAME==="arena")$("start").innerHTML=`전투시작 <small style="font-weight:700;opacity:.7">🎫1 · 남은 ${a.n}</small>`}
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return s>=3600?`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
/* 로비 */
let PARTY=[], OPPO=null, CUR_OPPO=null, OPP_NAME="", LTAB="match";
function drawLobby(){
 $("me_nick").textContent=myNick();
 const deck=defDeck().filter(c=>col().includes(c));
 $("me_pw").textContent=GAME==="dungeon"?(rec().dungeon||0)+"층":deckPower(deck.map(c=>[c,getStage(c)]));
 $("me_win").textContent=GAME==="dungeon"?(rec().dungeon||0):(rec().wins||0);
 const show=GAME==="dungeon"||!deck.length?col().slice(-3):deck;
 $("stage").innerHTML=(show.length?show.map(c=>{const d=decode(c);const R=judge(d.b,d.a),st=getStage(c);return `<div class="u" data-c="${c}">${artWithImage(R.race,st,R.elem)}<span class="nm">${nameOf(R,st)}</span></div>`}).join(""):`<div class="u empty">${GAME==="dungeon"?"소환수가 없어요":"방어덱이 비었어요"}</div>`)+(GAME==="dungeon"||!deck.length?"":`<span class="lead">방어덱</span>`);
 $("stage").querySelectorAll(".u[data-c]").forEach(el=>el.onclick=()=>openDetail(el.dataset.c,getStage(el.dataset.c)));
 const fr=friendsV2().length; $("rival_n").textContent=fr; $("rival_n2").textContent=fr;
 $("rival_n").classList.toggle("hidden",!fr); $("rival_n2").classList.toggle("hidden",!fr);
}
function openList(tab){LTAB=tab||"match";$("list").classList.remove("hidden");$("ltabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===LTAB));drawRows()}
function rowHTML(o){
 const first=o.d[0]; const d=decode(first[0]); const R=judge(d.b,d.a);
 const beat=listState().beat.includes(o.key);
 return `<div class="rw ${beat?"beat":""}"><div class="av">${artWithImage(R.race,first[1],R.elem)}<span class="st">${first[1]}</span></div><div class="inf"><b>${o.n||"소환사"}</b><small>방어덱 ${o.d.length}마리${o.bot?"":" · 친구"}</small></div><div class="pw"><small>⚔️</small>${deckPower(o.d)}</div>${beat&&o.bot?`<div class="won">승리</div>`:`<button class="gb" data-k="${o.key}">🎫1 ${beat?"재도전":"전투"}</button>`}</div>`;
}
let LIST_TIMER=null;
function drawRows(){
 const box=$("rows"); clearInterval(LIST_TIMER);
 const st=rec().streak||0; $("streak").textContent=st?`${st}연승 중`:"연승 없음";
 $("refresh").classList.toggle("hidden",LTAB!=="match");
 if(GAME==="dungeon"){ $("list_ttl").textContent="던전"; $("refresh").classList.add("hidden"); $("streak").textContent=`최고 ${rec().dungeon||0}층`;
  if(LTAB==="match"){const best=rec().dungeon||0;
   box.innerHTML=Array.from({length:MAXFLOOR},(_,i)=>{const f=i+1,rw=floorReward(f),open=f<=best+1;return `<div class="rw ${open?"":"beat"}"><div class="av" style="display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#f2c75c">${f}F</div><div class="inf"><b>${f}층</b><small>몬스터 ${floorEnemyCount(f)}마리 · ${floorStage(f)}단계 · 능력치 +${Math.round((floorScale(f)-1)*100)}%</small></div><div class="rec">${rw?STONE[rw][0]+"<br>30% / 조각 70%"+(claimedToday(f)?"<br>오늘 받음":""):"보상 없음"}</div>${open?`<button class="gb" data-f="${f}">입장</button>`:`<div class="won" style="opacity:.5">🔒</div>`}</div>`}).join("");
   box.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{FLOOR=+b.dataset.f;OPP_NAME=FLOOR+"층";openSetup()});return}
 }
 if(LTAB==="match"||LTAB==="rival"){
  const list=LTAB==="match"?botDecks():friendsV2().map((f,i)=>({...f,key:"f"+i}));
  box.innerHTML=list.map(rowHTML).join("")||`<p style="color:var(--ink2);text-align:center;padding:30px 10px">아직 친구가 없어요.<br>마이페이지 친구 목록에서 친구 코드를 넣어 보세요.</p>`;
  box.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const o=list.find(x=>x.key===b.dataset.k);OPPO=o;CUR_OPPO=o.key;OPP_NAME=o.n||"소환사";openSetup()});
  box.querySelectorAll(".av").forEach((av,i)=>{av.style.cursor="pointer";av.onclick=()=>openDeck(list[i])});
  if(LTAB==="match"){const tick=()=>{const left=REFRESH_MS-(Date.now()-listState().t);const b=$("refresh");if(left<=0){b.disabled=false;b.textContent="리스트 갱신"}else{b.disabled=true;b.textContent="갱신 "+fmtT(left)}};tick();LIST_TIMER=setInterval(tick,1000)}
 }else if(LTAB==="rec"){
  const L=rec().log||[];
  box.innerHTML=L.map(r=>`<div class="rw ${r.w?"":"beat"}"><div class="av" style="display:flex;align-items:center;justify-content:center;font-size:26px">${r.w?"🏆":"💀"}</div><div class="inf"><b>${r.o}</b><small>${r.a} vs ${r.b}</small></div><div class="rec">${new Date(r.t).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})}<br>${new Date(r.t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}</div><div class="won">${r.w?"승리":"패배"}</div></div>`).join("")||`<p style="color:var(--ink2);text-align:center;padding:30px 10px">아직 전투 기록이 없어요.</p>`;
 }else{
  box.innerHTML=`<div class="rw"><div class="av" style="display:flex;align-items:center;justify-content:center;font-size:26px">🏆</div><div class="inf"><b>${myNick()}</b><small>${GAME==="dungeon"?"최고 "+(rec().dungeon||0)+"층":(rec().wins||0)+"승 "+(rec().losses||0)+"패"}</small></div><div class="rec">다른 소환사 순위는<br>서버가 열리면 보여요</div></div>`;
 }
}
function openDeck(o){ // 상대 방어덱 전체 보기
 OPPO=o;CUR_OPPO=o.key;OPP_NAME=o.n||"소환사";openSetup();
}
/* 대전 준비 */
function openSetup(){
 $("list").classList.add("hidden"); $("setup").classList.remove("hidden");
 if(GAME==="dungeon"){MODE="manual";$("modes").classList.add("hidden");$("op_lab").textContent=FLOOR+"층 몬스터";$("setup_sub").textContent=`몬스터 ${floorEnemyCount(FLOOR)}마리 · ${floorStage(FLOOR)}단계`;$("setup_ttl").innerHTML=`<b>던전 ${FLOOR}층</b>`}
 else{$("op_lab").textContent=OPP_NAME+"의 방어덱";$("setup_sub").textContent="전투력 "+deckPower(OPPO.d);$("setup_ttl").innerHTML=`<b>대전 준비</b>`}
 if(!PARTY.length){const c=col();if(c.length)PARTY=[c[c.length-1]]}
 drawSetup(); drawAtk();
}
function ptHTML(c,st,cls,extra){const d=decode(c);const R=judge(d.b,d.a);return `<div class="pt ${cls||""}" data-c="${c}" data-s="${st}"><span class="stars">${"★".repeat(st)}</span>${artWithImage(R.race,st,R.elem)}<span class="el">${ELEM[R.elem].ic}</span><span class="st">${st}</span>${extra||""}</div>`}
function drawSetup(){
 $("my_tri").innerHTML=Array.from({length:3},(_,i)=>PARTY[i]?ptHTML(PARTY[i],getStage(PARTY[i]),"",i===0?`<span class="ld">LEADER</span>`:""):`<div class="pt empty">+</div>`).join("");
 $("op_tri").innerHTML=GAME==="dungeon"?Array.from({length:3},(_,i)=>i<floorEnemyCount(FLOOR)?`<div class="pt empty op" style="font-size:22px">👹</div>`:`<div class="pt empty">·</div>`).join():Array.from({length:3},(_,i)=>OPPO.d[i]?ptHTML(OPPO.d[i][0],OPPO.d[i][1],"op"):`<div class="pt empty">💀</div>`).join("");
 $("roster").innerHTML=col().map(c=>ptHTML(c,getStage(c),PARTY.includes(c)?"on":"",`<span class="i">i</span>`)).join("")||`<p style="color:var(--ink2);grid-column:1/-1;text-align:center">아직 소환수가 없어요. <a href="index.html" style="color:var(--gold)">먼저 소환해 주세요.</a></p>`;
 $("roster").querySelectorAll(".pt").forEach(el=>{
  el.querySelector(".i").onclick=(ev)=>{ev.stopPropagation();openDetail(el.dataset.c,+el.dataset.s)};
  el.onclick=()=>{const c=el.dataset.c;if(PARTY.includes(c))PARTY=PARTY.filter(x=>x!==c);else if(PARTY.length<3)PARTY.push(c);else{toast("3마리까지만 데려갈 수 있어요");return}drawSetup()};
 });
 $("my_tri").querySelectorAll(".pt[data-c]").forEach(el=>el.onclick=()=>openDetail(el.dataset.c,+el.dataset.s));
 $("op_tri").querySelectorAll(".pt[data-c]").forEach(el=>el.onclick=()=>openDetail(el.dataset.c,+el.dataset.s));
}
/* 상세 팝업 */
function openDetail(c,st){
 const d=decode(c); const R=judge(d.b,d.a); const f=makeFighter({d,h:c},st,"x",0);
 $("d_ttl").innerHTML=`${nameOf(R,st)} <b>${"★".repeat(st)}</b>`;
 $("d_art").innerHTML=`<div class="stars">${"★".repeat(st)}</div>${artWithImage(R.race,st,R.elem)}<div class="ty">${ELEM[R.elem].ic}${ELEM[R.elem].n} · ${POW[R.pow][1]}${d.nick?" · "+d.nick:""}</div>`;
 const stt=f.st;
 $("d_st").innerHTML=`<span style="color:var(--ink3)">전투력</span><span>${power(stt)}</span>`+STN.map((n,i)=>`<span style="color:var(--ink2)">${n}</span><span>${i===0?stt[0]*10:stt[i]}</span>`).join("")+`<span style="color:var(--ink2)">속도</span><span>${speed(f)}</span>`;
 const dmgOf=(s)=>showDmg(MAGICAL.has(R.pow)&&s?stt[2]:stt[1],s?s.m:f.basic);
 $("d_sks").innerHTML=`<div class="sk port">${artWithImage(R.race,st,R.elem)}</div>`+f.skills.map((s,i)=>`<div class="sk ${s.t==="hit"||s.t==="debuff"?R.elem:""}" data-i="${i}">${skIcon(s)}<span class="t">${s.tier}</span></div>`).join("");
 $("d_sks").querySelectorAll(".sk[data-i]").forEach(el=>el.onclick=()=>{
  const on=el.classList.contains("on"); $("d_sks").querySelectorAll(".sk").forEach(x=>x.classList.remove("on"));
  if(on){$("tip").classList.add("hidden");return}
  el.classList.add("on"); const s=f.skills[+el.dataset.i];
  $("tip").innerHTML=`<b>${s.n}</b>${s.d||""}${s.t==="hit"?` 데미지 ${dmgOf(s)}.`:""}${s.e&&EFF[s.e]?`<div class="cd">${EFF[s.e][0]}: ${EFF[s.e][1]}</div>`:""}<div class="cd">${s.tier}단계 스킬 · 쿨타임 ${s.tier}턴</div>`; $("tip").classList.remove("hidden");
 });
 $("detail").classList.remove("hidden");
}
$("d_x").onclick=()=>{$("detail").classList.add("hidden");$("tip").classList.add("hidden")};
$("detail").onclick=(e)=>{if(e.target===$("detail"))$("d_x").onclick()};
/* 전투 시작 */
async function run(){
 if(BUSY)return;
 if(!PARTY.length){toast("내 소환수를 하나는 골라야 해요");return}
 if(GAME==="arena"){if(!useArenaTicket()){toast("대전권이 없어요. "+fmtT(arenaTickets().next)+" 뒤에 1개 차요");return}drawAtk()}
 BUSY=true;
 const a=PARTY.map(c=>({h:{d:decode(c),h:c},stage:getStage(c)}));
 TA=a.map((x,i)=>makeFighter(x.h,x.stage,"a",i));
 TB=GAME==="dungeon"?Array.from({length:floorEnemyCount(FLOOR)},(_,i)=>makeMonster(FLOOR,i)):OPPO.d.map(([c,st],i)=>makeFighter({d:decode(c),h:c},st,"b",i));
 ALL=[...TA,...TB];
 rnd=rng(hash(ALL.map(x=>x.code+x.stage).join("|")+Date.now()));
 $("setup").classList.add("hidden");$("lobby").classList.add("hidden");$("fight").classList.remove("hidden");$("result").classList.add("hidden");
 $("fight").className="scene "+(GAME==="dungeon"?"bg-dungeon":"bg-arena");
 $("field").innerHTML=ALL.map(unitHTML).join(""); $("log").innerHTML=""; $("cap").textContent="전투 시작";
 $("c_auto").classList.toggle("hidden",GAME==="dungeon"); $("c_auto").classList.toggle("on",MODE==="auto");
 await loop();
}

$("cancel").onclick=()=>{$("setup").classList.add("hidden");if(GAME==="arena"||GAME==="dungeon")openList(LTAB)};
$("modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;$("modes").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
$("c_spd").onclick=()=>{SPD=SPD===1?2:SPD===2?3:1;$("c_spd").textContent="×"+SPD};
$("c_log").onclick=()=>{LOGON=!LOGON;$("log").classList.toggle("hidden",!LOGON);$("c_log").classList.toggle("on",LOGON)};

$("r_ok").onclick=()=>{$("result").classList.add("hidden");$("fight").classList.add("hidden");$("lobby").classList.remove("hidden");drawLobby();openList(LTAB)};
$("r_next").onclick=()=>{$("result").classList.add("hidden");$("fight").classList.add("hidden");$("lobby").classList.remove("hidden");FLOOR=Math.min(MAXFLOOR,FLOOR+1);OPP_NAME=FLOOR+"층";openSetup()};
$("list_x").onclick=()=>{$("list").classList.add("hidden");clearInterval(LIST_TIMER)};
$("ltabs").querySelectorAll("button").forEach(b=>b.onclick=()=>openList(b.dataset.t));
$("refresh").onclick=()=>{if(!canRefresh())return;refreshList()};
$("btn_go").onclick=()=>openList("match");
$("btn_rival").onclick=()=>openList(GAME==="dungeon"?"match":"rival");
$("bb_rec").onclick=()=>openList("rec");
$("bb_info").onclick=()=>openList("rank");
/* 방어덱 편집: 대전 준비 화면을 재사용 */
let DEFMODE=false;
$("bb_def").onclick=()=>{
 if(GAME==="dungeon"){location.href="index.html#colsec";return}
 DEFMODE=true; const saved=PARTY.slice(); PARTY=defDeck().filter(c=>col().includes(c));
 $("setup").classList.remove("hidden"); $("setup_ttl").innerHTML=`<b>방어덱 등록</b>`; $("setup_sub").textContent="다른 소환사가 이 덱과 싸워요"; $("op_lab").textContent="공격해 오는 소환사"; $("modes").classList.add("hidden");
 $("start").textContent="저장"; $("cancel").textContent="취소";
 const back=()=>{DEFMODE=false;$("start").textContent="전투시작";PARTY=saved;$("start").textContent="전투시작";$("cancel").textContent="전투취소";$("modes").classList.remove("hidden");$("setup").classList.add("hidden");$("start").onclick=run;$("cancel").onclick=cancelSetup;drawLobby()};
 $("start").onclick=()=>{setDefDeck(PARTY.slice());toast("방어덱을 저장했어요. 친구 코드도 바뀌었어요");back()};
 $("cancel").onclick=back;
 OPPO={d:[]}; drawSetup(); $("op_tri").innerHTML=Array.from({length:3},()=>`<div class="pt empty">?</div>`).join("");
};
function cancelSetup(){$("setup").classList.add("hidden");openList(LTAB)}
$("cancel").onclick=cancelSetup;
/* 시작 */
(function(){
 const q=new URLSearchParams(location.search);
 if(GAME==="dungeon"){$("tab_d").classList.add("on");$("btn_go").textContent="입장하기";$("btn_rival").classList.add("hidden");$("bb_def").innerHTML="<i>📖</i>소환수";document.title="던전";$("lobby").className="scene bg-dungeon"}
 else $("tab_a").classList.add("on");
 const c=col(); if(c.length)PARTY=[c[c.length-1]];
 drawLobby();
 const f=q.get("f"); if(f!=null&&friendsV2()[+f]){const o={...friendsV2()[+f],key:"f"+f};OPPO=o;CUR_OPPO=o.key;OPP_NAME=o.n||"소환사";LTAB="rival";openSetup()}
 if(GAME==="arena"){const tick=()=>{const left=REFRESH_MS-(Date.now()-listState().t);$("lobby_timer").textContent=left>0?"리스트 갱신까지 "+fmtT(left):"리스트 갱신 가능";drawAtk()};tick();setInterval(tick,1000)}else $("atk_row").classList.add("hidden");
})();
