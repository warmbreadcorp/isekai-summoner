<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>아레나</title>
<meta name="description" content="방어덱을 걸어 두고, 다른 소환사의 방어덱을 골라 싸워요.">
<style>
:root{--gold:#f2c75c;--gold2:#b8862b;--gold3:#6b4a12;--wood:#3a2616;--wood2:#241508;--panel:#2b1a0e;--ink:#fff4dc;--ink2:#d9c39a;--ink3:#9a8560;--blue:#4aa3ff;--green:#5fd45f;--red:#ff5a4a;--orange:#ff8a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0a12}
body{color:var(--ink);font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
#fight{z-index:10}
.scene{position:absolute;inset:0;background-size:cover;background-position:center bottom}
.hidden{display:none!important}
.bg-lobby{background-image:url(img/bg/lobby.jpg?v=4)}
.bg-arena{background-image:url(img/bg/arena.jpg?v=4)}
.bg-dungeon{background-image:url(img/bg/dungeon.jpg?v=4)}
.scene::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.45))}
/* 공통 버튼 */
.gb{position:relative;border:2px solid #5a3b10;border-radius:12px;background:linear-gradient(180deg,#ffd978,#e0a030 55%,#c47f16);color:#3a2000;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 3px 0 #6b4512,0 6px 14px rgba(0,0,0,.45);padding:12px 18px;font-size:17px;letter-spacing:-.3px}
.gb:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4512}
.gb.orange{background:linear-gradient(180deg,#ffb45c,#ff7f1f 55%,#d85a08);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);border-color:#7a3808}
.gb.green{background:linear-gradient(180deg,#b8ec6a,#78c53a 55%,#4d9a1c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);border-color:#2d5f0c}
.gb.wood{background:linear-gradient(180deg,#8a6236,#5a3a1a);color:var(--ink);border-color:#2a1808;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.gb:disabled{filter:grayscale(.7) brightness(.7);cursor:default}
.gb .badge{position:absolute;top:-10px;right:-10px;background:#e2302a;color:#fff;border:2px solid #fff;border-radius:999px;min-width:26px;height:26px;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px}
/* 상단 HUD */
.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;padding-top:max(10px,env(safe-area-inset-top))}
.tabs{display:flex;gap:6px}
.tab{height:40px;padding:0 14px;border-radius:10px;border:2px solid #3a2a12;background:linear-gradient(180deg,#5a4426,#2a1a08);color:#c9b48a;font-weight:800;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tab.on{background:linear-gradient(180deg,#2a2114,#0f0a04);color:var(--gold);border-color:var(--gold2);box-shadow:0 0 0 2px #0c0803,0 0 12px rgba(242,199,92,.35)}
.me{text-align:right;font-size:13px;color:var(--ink);text-shadow:0 1px 3px #000;line-height:1.5}
.me b{font-size:15px;color:var(--gold)}
.me .ro{display:flex;gap:10px;justify-content:flex-end;font-weight:800}
/* 로비 */
.stage{position:absolute;left:0;right:0;bottom:17%;height:38%;display:flex;align-items:flex-end;justify-content:center;gap:2%;padding:0 26% 0 6%}
.stage .u{position:relative;width:26%;max-width:190px;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center}
.stage .u img,.stage .u svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.stage .u .nm{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000;color:var(--ink)}
.stage .u.empty{border:2px dashed rgba(255,244,220,.35);border-radius:14px;aspect-ratio:1/0.9;color:rgba(255,244,220,.55);font-size:12px;align-items:center}
.stage .lead{position:absolute;left:14px;bottom:-54px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--gold);text-shadow:0 1px 2px #000;background:rgba(0,0,0,.45);border:1px solid var(--gold2);border-radius:6px;padding:2px 8px}
.sidebtn{position:absolute;right:12px;top:42%;width:34%;max-width:220px;display:flex;flex-direction:column;gap:14px;z-index:4}
.sidebtn .gb{font-size:20px;padding:18px 10px}
.bbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:5}
.bbar .ib{width:72px;height:66px;border-radius:12px;border:2px solid #3a2a12;background:linear-gradient(180deg,#f0c060,#a86f1c);color:#2a1800;font-weight:900;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #5a3a0c,0 6px 10px rgba(0,0,0,.4);text-decoration:none}
.bbar .ib i{font-style:normal;font-size:24px;line-height:1}
.bbar .ib.back{background:linear-gradient(180deg,#b8ec6a,#4d9a1c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.timer{position:absolute;right:14px;top:72px;text-align:right;font-size:12px;color:var(--ink2);text-shadow:0 1px 2px #000;z-index:4}
/* 모달 */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.frame{position:relative;width:100%;max-width:720px;max-height:96%;background:linear-gradient(180deg,#3e2814,#2a1a0c);border:3px solid #a67a2e;outline:2px solid #3a2410;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,220,140,.15);display:flex;flex-direction:column}
.frame .ttl{position:absolute;left:50%;top:-16px;transform:translateX(-50%);background:linear-gradient(180deg,#c59a4a,#8a5f1e);border:2px solid #4a2e0a;border-radius:8px;padding:4px 28px;font-weight:900;font-size:18px;color:#2a1800;white-space:nowrap}
.frame .ttl::before,.frame .ttl::after{content:"◆";color:#5a3a0c;font-size:10px;margin:0 8px;vertical-align:middle}
.frame .x{position:absolute;right:-8px;top:-14px;width:40px;height:40px;border-radius:9px;border:2px solid #4a2e0a;background:linear-gradient(180deg,#f0c060,#a86f1c);font-weight:900;font-size:18px;color:#2a1800;z-index:2}
.frame .body{display:flex;gap:10px;padding:26px 12px 12px;min-height:0;flex:1}
.ltabs{display:flex;flex-direction:column;gap:8px;width:88px;flex:none}
.ltabs button{position:relative;border:2px solid #3a2410;border-radius:8px;background:linear-gradient(180deg,#5a4426,#2a1a08);color:#c9b48a;font-weight:800;font-size:13px;padding:11px 4px}
.ltabs button.on{background:linear-gradient(180deg,#d8a84a,#9a6a1c);color:#2a1800}
.ltabs .badge{position:absolute;top:-8px;right:-8px;background:#e2302a;color:#fff;border:2px solid #fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.chip{border:2px solid #3a2410;border-radius:8px;background:linear-gradient(180deg,#3a2a14,#1c1008);color:var(--gold);font-weight:800;font-size:13px;padding:8px 12px}
.chip.btn{background:linear-gradient(180deg,#5a4426,#2a1a08);color:var(--ink)}
.chip.btn:disabled{color:var(--ink3);cursor:default}
.rows{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.rw{display:grid;grid-template-columns:60px 1fr auto auto;gap:10px;align-items:center;background:linear-gradient(90deg,#8f6a2e,#d9b35c 40%,#c7a04a);border:2px solid #5a3a10;border-radius:8px;padding:6px 8px;color:#2a1800;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.rw.beat{background:linear-gradient(90deg,#7a5a2a,#a88a46 40%,#9a7c3a)}
.rw .av{width:60px;height:60px;border-radius:8px;background:#1d130a;border:2px solid #5a3a10;position:relative;overflow:hidden}
.rw .av img,.rw .av svg{width:100%;height:100%;object-fit:contain}
.rw .av .st{position:absolute;left:-2px;bottom:-2px;background:#f2c75c;border:2px solid #5a3a10;border-radius:999px;width:20px;height:20px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.rw .inf{min-width:0}
.rw .inf b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .inf small{font-size:12px;color:#4a3410;font-weight:700}
.rw .pw{font-weight:900;font-size:18px;white-space:nowrap}
.rw .pw small{font-size:12px;font-weight:800;color:#4a3410;margin-right:3px}
.rw .gb{padding:8px 14px;font-size:15px;min-width:76px}
.rw .won{min-width:76px;text-align:center;font-weight:900;font-size:16px;color:#2a1800;background:linear-gradient(180deg,#ffe49a,#e0b040);border:2px solid #5a3b10;border-radius:10px;padding:8px 6px}
.rw .rec{font-size:12px;font-weight:800;color:#4a3410;text-align:right;line-height:1.3}
/* 대전 준비 */
.setup{position:absolute;inset:0;background:rgba(10,6,3,.92);z-index:15;display:flex;flex-direction:column;padding:12px;padding-top:max(12px,env(safe-area-inset-top));gap:10px}
.setup .top{display:flex;justify-content:space-between;align-items:center;color:var(--ink2);font-size:14px}
.setup .top b{color:var(--gold);font-size:18px}
.vsbox{border:2px solid #a67a2e;border-radius:10px;background:linear-gradient(180deg,#2a1a0c,#1a1006);padding:12px 8px;display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:6px;flex:none}
.vsbox .vs{text-align:center;font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 14px rgba(242,199,92,.6)}
.vsbox .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.vsbox .side .lab{font-size:12px;font-weight:800;color:var(--ink2)}
.vsbox .side .lab.me{color:var(--blue)} .vsbox .side .lab.op{color:var(--gold)}
.tri{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pt{position:relative;width:72px;height:72px;border-radius:10px;border:3px solid #2e4e8a;background:#101a30;overflow:hidden;cursor:pointer;flex:none}
.pt.op{border-color:#b8862b;background:#2a1a08}
.pt.empty{border-color:#3a2a14;background:#1a1208;display:flex;align-items:center;justify-content:center;color:#5a4a2a;font-size:26px;cursor:default}
.pt img,.pt svg{width:100%;height:100%;object-fit:contain;display:block}
.pt .st{position:absolute;right:3px;bottom:2px;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.pt .stars{position:absolute;left:3px;top:2px;font-size:9px;letter-spacing:-1px;color:#ff5ec8;text-shadow:0 0 2px #000}
.pt .el{position:absolute;left:2px;bottom:2px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.6);font-size:12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25)}
.pt .ld{position:absolute;right:-2px;top:-2px;background:var(--gold);color:#2a1800;font-size:9px;font-weight:900;padding:0 4px;border-radius:0 0 0 6px}
.roster{flex:1;min-height:0;border:2px solid #3a2410;border-radius:10px;background:#120c06;padding:8px;overflow:auto}
.roster .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.roster .pt.on{box-shadow:0 0 0 3px var(--gold),0 0 14px rgba(242,199,92,.6)}
.roster .pt.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 6px #000;background:rgba(0,0,0,.25)}
.roster .pt .i{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4);z-index:2}
.setup .acts{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap}
.setup .acts .gb{flex:1;padding:14px 10px;font-size:17px}
.modes{display:flex;gap:4px;width:100%}
.modes button{flex:1;border:2px solid #3a2410;border-radius:8px;background:#1a1208;color:var(--ink3);font-size:12.5px;font-weight:800;padding:8px 4px}
.modes button.on{background:linear-gradient(180deg,#d8a84a,#9a6a1c);color:#2a1800}
/* 상세 팝업 */
.detail{position:absolute;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}
.detail .frame{max-width:560px;padding:0}
.detail .dbody{padding:32px 14px 16px;display:grid;grid-template-columns:1fr 64px;gap:10px;min-height:0;overflow:auto}
.detail .art{position:relative;height:240px;display:flex;align-items:flex-end;justify-content:center}
.detail .art img,.detail .art svg{height:100%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.6))}
.detail .stars{position:absolute;left:0;top:0;font-size:16px;color:#ff5ec8;text-shadow:0 0 3px #000;letter-spacing:-1px}
.detail .ty{position:absolute;left:0;bottom:0;color:var(--ink2);font-size:14px;font-weight:800}
.detail .st{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:16px;font-weight:800;margin-top:10px;color:var(--ink2)}
.detail .st span{color:var(--ink);font-variant-numeric:tabular-nums}
.detail .ttl b{color:#ffb640}
.sks{display:flex;flex-direction:column;gap:8px;align-items:center}
.sk{width:58px;height:58px;border-radius:10px;border:2px solid #a67a2e;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;background:radial-gradient(circle at 40% 35%,#6a5a2a,#1c1208);box-shadow:inset 0 0 10px rgba(0,0,0,.6);cursor:pointer;flex:none}
.sk.port{padding:2px;overflow:hidden} .sk.port img,.sk.port svg{width:100%;height:100%;object-fit:contain}
.sk .t{position:absolute;right:2px;top:1px;font-size:10px;font-weight:900;color:var(--gold);text-shadow:0 0 3px #000}
.sk.fire{background:radial-gradient(circle at 40% 35%,#ff9a3a,#7a1a00)} .sk.water{background:radial-gradient(circle at 40% 35%,#5ec8ff,#0a2a6a)} .sk.earth{background:radial-gradient(circle at 40% 35%,#c9a060,#4a2c08)} .sk.wind{background:radial-gradient(circle at 40% 35%,#a8f0b0,#0e5a2a)} .sk.light{background:radial-gradient(circle at 40% 35%,#fff6c0,#9a7a10)} .sk.dark{background:radial-gradient(circle at 40% 35%,#9a60e0,#1a0a3a)}
.sk.on{box-shadow:0 0 0 3px var(--gold),0 0 14px rgba(242,199,92,.6)}
.tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,460px);background:rgba(20,12,6,.96);border:2px solid #a67a2e;border-radius:10px;padding:12px 14px;z-index:40;color:var(--ink);font-size:14px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.tip b{display:block;text-align:center;font-size:18px;color:#ffb640;margin-bottom:6px}
.tip .cd{color:var(--ink3);font-size:12.5px;margin-top:4px}
/* 전투 */
.field{position:absolute;inset:0}
.unit{position:absolute;width:19%;max-width:150px;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:opacity .4s}
.unit .bars{width:100%;position:relative;margin-bottom:4px}
.unit .lv{position:absolute;left:-12px;top:-6px;width:30px;height:30px;border-radius:999px;background:radial-gradient(circle at 40% 35%,#fff,#d8d8e0);border:2px solid #333;color:#2a1800;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.unit.b .lv{background:radial-gradient(circle at 40% 35%,#c9a0ff,#6a2ac0);color:#fff;border-color:#2a0a5a}
.unit .hp{height:9px;background:#1a1a1a;border:1.5px solid #222;border-radius:4px;margin-left:12px;overflow:hidden}
.unit .hp i{display:block;height:100%;background:linear-gradient(180deg,#9cff6a,#36b321);transition:width .3s}
.unit .hp i.low{background:linear-gradient(180deg,#ff9a6a,#d83a1a)}
.unit .tg{height:4px;background:#1a1a1a;border:1px solid #222;border-top:none;border-radius:0 0 4px 4px;margin-left:12px;overflow:hidden}
.unit .tg i{display:block;height:100%;background:linear-gradient(90deg,#4ae0ff,#2a80ff);transition:width .2s}
.unit .im{width:100%;aspect-ratio:1;position:relative}
.unit .im img,.unit .im svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.55))}
.unit.b .im img,.unit.b .im svg{transform:scaleX(-1)}
.unit.down{opacity:.25;filter:grayscale(1)}
.unit.hit .im{animation:shake .3s}
.unit.act .im::after{content:"";position:absolute;left:10%;right:10%;bottom:-4%;height:16%;border-radius:50%;background:radial-gradient(ellipse,rgba(242,199,92,.9),rgba(242,199,92,0) 70%)}
.unit .arrow{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:28px;color:#ffb020;text-shadow:0 2px 3px #000;animation:bob 1s infinite;display:none;z-index:3}
.unit.tgt .arrow{display:block}
.unit.cantgt{cursor:pointer}
.unit .effs{position:absolute;left:0;right:0;bottom:-2px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;pointer-events:none}
.unit .effs span{font-size:9.5px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid #c33;color:#ffb0a0}
.unit .effs span.good{border-color:#3c3;color:#b0ffb0}
.unit .nm{font-size:11px;font-weight:800;text-shadow:0 1px 3px #000;white-space:nowrap;margin-top:12px}
.fl{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:24px;color:#fff;text-shadow:0 0 4px #000,0 2px 2px #000,0 0 10px rgba(255,80,40,.8);animation:fl 1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
.fl.heal{text-shadow:0 0 4px #000,0 2px 2px #000,0 0 10px rgba(80,255,80,.8);color:#c0ffc0}
.fl.miss{font-size:16px;color:#ddd}
.fl.eff{font-size:14px;color:#ffd080;top:50%}
@keyframes fl{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.cap{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,.55);border:1px solid rgba(242,199,92,.4);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--ink);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:6}
.ctl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.ctl button{width:58px;height:58px;border-radius:12px;border:2px solid #cfcfcf;background:rgba(255,255,255,.92);color:#222;font-weight:900;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.ctl button.on{background:#ffd040;border-color:#8a6010}
.ctl .k{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;background:#222;color:#fff;padding:1px 5px;border-radius:4px;white-space:nowrap}
.skbar{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;z-index:7;padding-bottom:env(safe-area-inset-bottom)}
.skbar .sk{width:66px;height:66px;font-size:28px;border-width:3px;border-color:#f0c060;background:radial-gradient(circle at 40% 35%,#ffe080,#a06a10);box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 0 8px rgba(0,0,0,.3)}
.skbar .sk.ready{box-shadow:0 0 0 2px #fff,0 0 16px rgba(255,220,100,.9)}
.skbar .sk.cd{filter:grayscale(.8) brightness(.6)}

.chip .im{width:100%;aspect-ratio:1}
.chip .im img,.chip .im svg{width:100%;height:100%;object-fit:contain}
.chip .hp{height:5px;border-radius:3px;background:#e4e0d6;overflow:hidden;margin:2px 1px 1px}
.chip .hp i{display:block;height:100%;background:#4fc84f}.chip .hp i.mid{background:#f2c440}.chip .hp i.low{background:#ff5a4a}
.chip.on{box-shadow:0 0 0 3px #ff5a36}
.chip.down{opacity:.35}
.chip.cantgt{cursor:pointer}
.chip .arrow{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:18px;color:#ff5a36;display:none;animation:bob 1s infinite}
.chip.tgt .arrow{display:block}
.tbox{height:172px;background:#fff;border-top:4px solid #1d1b18;position:relative;padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.tbox .msg{font-size:17px;font-weight:800;line-height:1.5;color:#1d1b18}
.tbox .msg .dmg{color:#d9371f}.tbox .msg .heal{color:#2b7a2b}.tbox .msg .eff{color:#5d574e;font-weight:700}
.menu{position:absolute;inset:0;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.menu button{border:3px solid #1d1b18;border-radius:12px;background:#fff;color:#1d1b18;font-family:inherit;font-weight:900;font-size:17px;padding:8px 12px;text-align:left;cursor:pointer;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.menu button:active{background:#fff1ec}
.menu button.pri{background:#1d1b18;color:#fff}
.menu button.cd{opacity:.4}
.menu button small{font-size:11px;font-weight:800;color:#5d574e;display:flex;gap:6px;align-items:center}
.menu button.pri small{color:#d0cbc0}
.menu button small .el{padding:0 6px;border-radius:999px;background:#eee9df;color:#1d1b18}
.menu button.back{grid-column:1/3;min-height:0;padding:6px;font-size:14px;justify-content:center;align-items:center;border-style:dashed}
.menu.list{grid-template-columns:1fr}
.gsc .ctl{position:absolute;right:12px;top:12px;left:auto;bottom:auto;gap:6px;padding:0}
.gsc .ctl button{width:40px;height:34px;font-size:12px;border-radius:9px;border:2px solid #1d1b18;background:#fff;color:#1d1b18;box-shadow:none}
.gsc .ctl button.on{background:#1d1b18;color:#fff}
.gsc .ctl .k{display:none}
.fl{z-index:9}
@media (min-width:600px){.esprite{width:30%;right:8%}.msprite{width:34%;left:8%}.ebox{width:40%}.mbox{width:42%}}




/* ===== 셀 채색 스킨: 소환수 그림과 같은 문법(얇은 어두운 윤곽선, 크림 면, 아래 한 단 그림자) ===== */
:root{--ink:#2b2b36;--ink2:#6a6a78;--line:#1a1a1f;--cream:#fffdf6;--cream2:#efe9da;--band:#d9d2c0;--hp:#5ad15a;--hp2:#f2c23e;--hp3:#ff5a4a;--acc:#ff6a4a;--acc2:#e04f30;--blue:#4a9be0;--sky:#dcecf7}
html,body{background:#dcecf7}
body{font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-weight:800}
.scene{background-size:cover;background-position:center bottom}
.scene::before{background:none}
.bg-lobby{background-image:url(img/bg/lobby.jpg?v=4)!important}
.bg-arena{background-image:url(img/bg/arena.jpg?v=4)!important}
.bg-dungeon{background-image:url(img/bg/dungeon.jpg?v=4)!important}
/* 공통 부품 */
.cel{background:var(--cream);border:var(--ln) solid var(--lc);border-radius:12px;box-shadow:0 3px 0 var(--band);color:var(--ink)}
.cel-btn{background:linear-gradient(180deg,#fff 0,#fff 55%,var(--cream2) 55%);border:var(--ln) solid var(--lc);border-radius:12px;box-shadow:0 3px 0 var(--line);color:var(--ink);font-weight:900}
.cel-btn.acc{background:linear-gradient(180deg,#ff8a6a 0,#ff8a6a 55%,var(--acc) 55%);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.cel-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
/* 로비 */
#lobby{display:flex;flex-direction:column;gap:10px;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.hud{position:static;padding:0;flex-direction:column;gap:10px;align-items:stretch;flex:none;z-index:2}
.tabs{gap:0;background:var(--cream);border:var(--ln) solid var(--lc);border-radius:12px;padding:0;overflow:hidden;box-shadow:0 3px 0 var(--band)}
.tab{flex:1;height:auto;padding:11px 0;border:none;background:transparent;color:var(--ink2);font-size:15px;justify-content:center;font-weight:900;border-radius:0;box-shadow:none;text-shadow:none}
.tab+.tab{border-left:var(--ln) solid var(--lc)}
.tab.on{background:var(--ink);color:#fff}
.me{text-align:left;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;background:var(--cream);border:var(--ln) solid var(--lc);border-radius:12px;box-shadow:0 3px 0 var(--band);color:var(--ink2);text-shadow:none}
.me b{color:var(--ink);font-size:16px;font-weight:900}
.me .ro{gap:12px;font-weight:800;justify-content:flex-end;font-size:13px}
.timer{position:static;text-align:center;font-size:13px;color:var(--ink);background:none;flex:none;padding:0;z-index:2;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.stage{position:relative;top:auto;bottom:auto;left:auto;right:auto;height:auto;flex:1;min-height:200px;background:none;border:none;border-radius:0;padding:10px 4% 40px;align-items:flex-end;justify-content:center;gap:4%;margin:0;box-shadow:none;z-index:1}
.stage::after{content:none}
.stage .u{z-index:1;width:30%;max-width:170px}
.stage .u:only-of-type{width:52%}
.stage .u div{filter:none!important}
.stage .u img,.stage .u svg{filter:none!important}
.stage .u::before{content:"";position:absolute;left:8%;right:8%;bottom:2%;height:9%;border-radius:50%;background:rgba(40,70,30,.22)}
.stage .u .nm{color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff;font-weight:900;font-size:13px;bottom:-24px}
.stage .u.empty{border:var(--ln) dashed var(--lc);color:var(--ink);border-radius:14px;font-size:14px;background:rgba(255,253,246,.6)}
.stage .lead{background:var(--ink);color:#fff;border:none;font-weight:900;letter-spacing:0;left:50%;transform:translateX(-50%);bottom:-2px;top:auto;padding:3px 12px;font-size:11px;border-radius:999px}
.gmenu{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:2}
.gmenu .gb,.gmenu .ib{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff 0,#fff 55%,var(--cream2) 55%)!important;border:var(--ln) solid var(--lc)!important;color:var(--ink)!important;font-size:14px;font-weight:900;padding:12px 6px;text-decoration:none;text-align:center;box-shadow:0 3px 0 var(--line)!important;height:auto;width:auto;line-height:1.2;border-radius:12px!important;backdrop-filter:none;text-shadow:none}
.gmenu #btn_go{grid-column:1/4;background:linear-gradient(180deg,#ff8a6a 0,#ff8a6a 55%,var(--acc) 55%)!important;color:#fff!important;font-size:19px;padding:15px 10px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.gmenu .gb:active,.gmenu .ib:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)!important}
.gmenu .gb .badge{position:absolute;top:-8px;right:-8px;background:var(--acc);color:#fff;border:2px solid var(--line);font-size:11px;min-width:22px;height:22px;border-radius:999px;margin:0}
.sidebtn,.bbar{display:none}
/* 창(모달) */
.modal{background:var(--sky);padding:0;align-items:stretch}
.frame,.modal .frame,.detail .frame,.result .frame{background:transparent;border:none;outline:none;color:var(--ink);max-width:none;height:100%;border-radius:0;box-shadow:none}
.frame .ttl{color:var(--ink);font-weight:900;font-size:20px;padding:14px 16px 0;text-shadow:none}
.frame .x{background:var(--cream);border:var(--ln) solid var(--lc);color:var(--ink);width:36px;height:36px;font-size:15px;top:12px;right:12px;border-radius:999px;box-shadow:0 2px 0 var(--line)}
.frame .body{padding:12px 14px 14px;gap:10px}
.ltabs{flex-direction:row;gap:0;background:var(--cream);border:var(--ln) solid var(--lc);border-radius:12px;padding:0;overflow:hidden;box-shadow:0 3px 0 var(--band)}
.ltabs button{flex:1;background:transparent;border:none;color:var(--ink2);font-weight:900;font-size:14px;padding:10px 2px;text-align:center;border-radius:0}
.ltabs button+button{border-left:var(--ln) solid var(--lc)}
.ltabs button.on{background:var(--ink);color:#fff}
.ltabs .badge{background:var(--acc);border:2px solid #fff;top:2px;right:2px}
.lhead .chip{background:var(--cream);border:var(--ln) solid var(--lc);color:var(--ink);font-weight:900;font-size:13px;padding:7px 14px;border-radius:999px;box-shadow:0 2px 0 var(--band);white-space:nowrap;width:auto}
.lhead .chip.btn:not(:disabled){background:var(--ink);color:#fff;box-shadow:0 2px 0 var(--line)}
.lhead .chip.btn:disabled{color:var(--ink2)}
.rows{gap:8px}
.rw,.rw.beat{background:var(--cream);border:var(--ln) solid var(--lc);color:var(--ink);border-radius:14px;padding:10px;box-shadow:0 3px 0 var(--band)}
.rw.beat{opacity:.6}
.rw .av{background:#fff;border:2px solid var(--line);border-radius:10px}
.rw .av div{filter:none!important}
.rw .av .st{background:var(--ink);color:#fff;border:none;border-radius:999px;font-weight:800}
.rw .inf b{font-weight:900;font-size:16px}
.rw .inf b::before{content:none}
.rw .inf small,.rw .pw small,.rw .rec{color:var(--ink2);font-weight:800;font-size:13px}
.rw .pw{font-weight:900;font-size:15px}
.rw .gb{background:linear-gradient(180deg,#ff8a6a 0,#ff8a6a 55%,var(--acc) 55%);color:#fff;border:var(--ln) solid var(--lc);padding:10px 14px;font-size:15px;min-width:72px;border-radius:12px;font-weight:900;box-shadow:0 3px 0 var(--line);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.rw .won{background:var(--cream2);border:var(--ln) solid var(--lc);color:var(--ink2);font-weight:900;font-size:14px;border-radius:12px;box-shadow:none}
/* 대전 준비 */
.setup{background:var(--sky);color:var(--ink);padding:12px;gap:10px}
.setup .top{color:var(--ink2);font-size:14px;text-shadow:none}.setup .top b{color:var(--ink);font-weight:900;font-size:20px}
.vsbox,.roster{background:var(--cream);border:var(--ln) solid var(--lc);border-radius:14px;box-shadow:0 3px 0 var(--band)}
.vsbox{padding:12px;grid-template-columns:1fr!important;gap:8px}
.vsbox .side{width:100%}
.vsbox .vs{color:var(--ink2);font-size:15px;margin:0;opacity:1;text-shadow:none}
.vsbox .side .lab{color:var(--ink);font-weight:900;font-size:13px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px}.vsbox .side .lab.me{color:var(--blue)}.vsbox .side .lab.op{color:var(--acc2)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-wrap:nowrap;width:100%}
.pt,.pt.op,.roster .pt,.tri .pt{width:auto;height:auto;aspect-ratio:auto;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:var(--ln) solid var(--lc);border-radius:12px;box-shadow:0 3px 0 var(--band)}
.tri .pt{border-color:var(--blue);box-shadow:0 3px 0 var(--blue)}.tri .pt.op{border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
.pt .pim{position:relative;aspect-ratio:1;background:#fff}
.pt .pim div,.detail .art div{filter:none!important}
.pt .pim img,.pt .pim svg{width:100%;height:100%;object-fit:contain;display:block}
.pt .pinfo{background:var(--cream);padding:6px 8px;display:flex;flex-direction:column;gap:1px;line-height:1.25;text-align:left;border-top:2px solid var(--line)}
.pt .pinfo b{font-weight:900;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .pinfo small{font-size:11px;color:var(--ink2);font-weight:800}
.pt.empty{aspect-ratio:1;background:rgba(255,255,255,.5);border:var(--ln) dashed var(--lc);color:var(--ink2);align-items:center;justify-content:center;font-size:22px;border-radius:12px;box-shadow:none}
.pt .ld{position:absolute;right:6px;top:6px;background:var(--ink);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:800}
.roster .pt .i{position:absolute;right:6px;top:6px;width:22px;height:22px;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;border-radius:999px;border:2px solid #fff}
.roster .pt.on{border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2);background:#fff6f2}
.roster .pt.on::after{content:"✓";position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;inset:auto;padding:0;border:2px solid #fff}
.roster .grid{grid-template-columns:repeat(3,1fr)!important;gap:8px}
.modes{background:var(--cream);border:var(--ln) solid var(--lc);border-radius:12px;padding:0;overflow:hidden;box-shadow:0 3px 0 var(--band);gap:0}
.modes button{background:transparent;border:none;color:var(--ink2);font-weight:900;font-size:13px;border-radius:0}
.modes button+button{border-left:var(--ln) solid var(--lc)}
.modes button.on{background:var(--ink);color:#fff}
.setup .acts .gb{font-size:17px;padding:14px 8px;border-radius:12px;border:var(--ln) solid var(--lc);font-weight:900;box-shadow:0 3px 0 var(--line)}
#start{background:linear-gradient(180deg,#ff8a6a 0,#ff8a6a 55%,var(--acc) 55%);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}#cancel{background:linear-gradient(180deg,#fff 0,#fff 55%,var(--cream2) 55%);color:var(--ink)}
/* 상세·팁 */
.detail{background:rgba(43,43,54,.45);padding:0;align-items:flex-end}
.detail .frame{height:auto;max-height:92%;border-radius:18px 18px 0 0;background:var(--sky);border:var(--ln) solid var(--lc);border-bottom:none}
.detail .ttl{color:var(--ink);text-shadow:none}.detail .ttl b{color:var(--acc2)}
.detail .stars{color:var(--ink);font-weight:900;font-size:13px;background:#fff;border:2px solid var(--line);padding:3px 10px;border-radius:999px}
.detail .ty,.detail .st{color:var(--ink2);font-weight:800}.detail .st span{color:var(--ink)}
.detail .art img,.detail .art svg{filter:none!important}
.sk,.skbar .sk{border:var(--ln) solid var(--lc);background:#fff;border-radius:12px;box-shadow:0 3px 0 var(--band)}
.sk.fire,.sk.water,.sk.earth,.sk.wind,.sk.light,.sk.dark{border-color:var(--line)}
.sk.on{box-shadow:0 3px 0 var(--acc2);border-color:var(--acc2)}
.sk .t{color:var(--ink);opacity:.8;font-weight:900}
.tip{background:var(--cream);color:var(--ink);border:var(--ln) solid var(--lc);font-size:14px;line-height:1.6;border-radius:14px;box-shadow:0 3px 0 var(--band)}
.tip b{color:var(--ink);font-weight:900;font-size:16px;text-align:left}
.tip .cd{color:var(--ink2)}
/* 결과 */
.result{background:rgba(43,43,54,.5)}
.result .frame{height:auto;background:var(--sky);border:var(--ln) solid var(--lc);border-radius:18px;max-width:460px;padding:30px 18px 18px;box-shadow:0 4px 0 var(--line)}
.result h2{color:var(--acc2);font-weight:900;font-size:36px;letter-spacing:1px;text-shadow:none}
.result h2.lose{color:var(--ink2)}
.result p{color:var(--ink2)}
.result .drop{background:#fff;border:var(--ln) solid var(--lc);color:var(--ink);border-radius:12px;font-weight:900}
#r_ok,#r_next{background:linear-gradient(180deg,#ff8a6a 0,#ff8a6a 55%,var(--acc) 55%);color:#fff;border:var(--ln) solid var(--lc);border-radius:12px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.toast{background:var(--ink);color:#fff;border:2px solid #fff;border-radius:999px;font-family:inherit}
/* ===== 전투 ===== */
#fight::before{background:none}
#fight .gb{position:absolute;inset:0;display:flex;flex-direction:column;background:none;padding-top:env(safe-area-inset-top)}
#fight .field{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding:22vh 12px 0;gap:14px}
#fight .esprite{max-width:38%}
#fight .msprite{max-width:48%}
#fight .rowA,#fight .rowB{display:flex;gap:8px;align-items:flex-start;min-height:0}
#fight .rowB{align-items:flex-end}
#fight .rowA .col,#fight .rowB .col{flex:0 0 56%;display:flex;flex-direction:column;gap:5px;min-width:0}
#fight .balls{display:flex;gap:5px;padding:0 6px}
#fight .rowB .balls{justify-content:flex-end}
#fight .chip{width:16px;height:16px;border-radius:999px;background:var(--acc);border:2px solid var(--line);box-shadow:none;padding:0;overflow:hidden;opacity:1;cursor:default;font-size:0;position:relative}
#fight .chip::before,#fight .chip::after{content:none}
#fight .chip.down{background:#c9c4b6}
#fight .chip.on{transform:scale(1.25)}
#fight .chip.cantgt{cursor:pointer}
#fight .chip.tgt{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc2)}
#fight .plate{padding:8px 10px 8px;width:100%;box-sizing:border-box;margin:0;position:relative;background:var(--cream);border:var(--ln) solid var(--lc);border-radius:12px;box-shadow:0 3px 0 var(--band);color:var(--ink);text-shadow:none}
#fight .plate::after{content:none}
#fight .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#fight .nm b{font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:none;color:var(--ink)}
#fight .nm span{font-size:11px;font-weight:900;white-space:nowrap;background:none;padding:0;box-shadow:none;color:var(--ink2)}
#fight .bar{height:9px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;margin-top:6px;padding:0}
#fight .bar i{display:block;height:100%;background:var(--hp);border-radius:999px;transition:width .3s}
#fight .bar i.mid{background:var(--hp2)}#fight .bar i.low{background:var(--hp3)}
#fight .sub{display:flex;align-items:center;gap:8px;margin-top:5px}
#fight .hpn{font-size:13px;font-weight:900;font-style:normal;font-variant-numeric:tabular-nums;min-width:4.5em;text-align:left;line-height:1;margin:0;color:var(--ink)}
#fight .exp{flex:1;height:6px;border-radius:999px;background:#fff;border:2px solid var(--line);overflow:hidden;margin:0;position:relative}
#fight .exp::before{content:none}
#fight .exp i{display:block;height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .18s}
#fight .effs{display:flex;gap:4px;justify-content:flex-start;min-height:0;margin-top:5px;flex-wrap:wrap}
#fight .effs:empty{display:none}
#fight .effs span{font-size:10px;font-weight:900;background:#fff;color:#c0392b;padding:0 7px;border-radius:999px;border:2px solid var(--line);text-shadow:none}
#fight .effs span.good{color:#1e8a4a}
#fight .esprite,#fight .msprite{position:relative;flex:1;width:auto;height:auto;aspect-ratio:1;max-width:44%;align-self:flex-start;transition:opacity .3s}
#fight .msprite{align-self:flex-end}
#fight .esprite::before,#fight .msprite::before{content:"";position:absolute;left:6%;right:6%;bottom:1%;height:10%;border-radius:50%;background:rgba(40,70,30,.22);z-index:0}
#fight .esprite>div,#fight .msprite>div{position:relative;z-index:1;width:100%;height:100%}
#fight .esprite img,#fight .msprite img,#fight .esprite svg,#fight .msprite svg{filter:none!important;animation:none!important}
#fight .esprite img,#fight .msprite img,#fight .esprite svg,#fight .msprite svg{width:100%;height:100%;object-fit:contain}
#fight .msprite img,#fight .msprite svg{transform:scaleX(-1)}
#fight .esprite.down,#fight .msprite.down{opacity:.2}
#fight .esprite.hit,#fight .msprite.hit{animation:shake .3s}
#fight .esprite.act>div::after,#fight .msprite.act>div::after{content:none}
#fight .ctl{position:static;display:flex;justify-content:flex-end;gap:6px;padding:6px 12px 6px;flex:none}
#fight .ctl button{width:auto;height:32px;padding:0 12px;font-size:12px;border:var(--ln) solid var(--lc);background:var(--cream);color:var(--ink);border-radius:999px;box-shadow:0 2px 0 var(--line);font-family:inherit;font-weight:900}
#fight .ctl button.on{background:var(--ink);color:#fff}
#fight .tbox{position:relative;flex:none;min-height:140px;max-height:50vh;margin:0 10px max(10px,env(safe-area-inset-bottom));border:var(--ln) solid var(--lc);border-radius:14px;box-shadow:0 3px 0 var(--band)!important;padding:16px;outline:none;background:var(--cream);height:auto;display:flex;flex-direction:column;overflow:auto}
#fight .tbox .msg{font-size:16px;line-height:1.5;color:var(--ink);font-weight:800}
#fight .tbox .msg .dmg{color:#d9371f}#fight .tbox .msg .heal{color:#1e8a4a}#fight .tbox .msg .eff{color:var(--ink2);font-weight:800}
#fight .tbox .msg::after{content:"▼";position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--ink2);animation:bob 1s infinite}
#fight .tbox:has(.menu:not(.hidden)) .msg{display:none}
#fight .menu{position:static;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;background:transparent;align-content:start}
#fight .menu button{border:var(--ln) solid var(--lc);background:linear-gradient(180deg,#fff 0,#fff 60%,var(--cream2) 60%);color:var(--ink);font-size:16px;text-align:left;padding:10px 12px 10px 30px;position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:3px;line-height:1.25;font-weight:900;border-radius:12px;font-family:inherit;box-shadow:0 3px 0 var(--line)}
#fight .menu button::before{content:"▶";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--acc2);opacity:0}
#fight .menu button.pri::before{opacity:1}
#fight .menu button.pri{background:linear-gradient(180deg,#fff6f2 0,#fff6f2 60%,#ffe4dc 60%);border-color:var(--acc2);box-shadow:0 3px 0 var(--acc2)}
#fight .menu button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#fight .menu button.cd{opacity:.45}
#fight .menu button small{font-size:11px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;line-height:1.2;font-weight:800}
#fight .menu button small .el{border:1.5px solid var(--line);padding:0 6px;background:#fff;color:var(--ink);border-radius:999px}
#fight .menu button.back{grid-column:1/3;min-height:44px;justify-content:center;align-items:center;font-size:14px;font-weight:900;padding-left:12px;background:var(--cream)}
#fight .menu button.back::before{content:none}
#fight .menu.list{grid-template-columns:1fr}
#fight .fl{font-family:inherit;font-weight:900;font-size:28px;color:#fff;text-shadow:2px 2px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line);top:20%}
#fight .fl.heal{color:#9cff9c}#fight .fl.miss{font-size:18px}#fight .fl.eff{font-size:14px}
#fight .log{background:var(--cream);border:var(--ln) solid var(--lc);color:var(--ink);border-radius:12px;top:60px;font-size:12px;box-shadow:0 3px 0 var(--band)}
#fight .log .l b{color:var(--ink)}#fight .log .dmg{color:#d9371f}#fight .log .heal{color:#1e8a4a}#fight .log .r{color:var(--ink2)}
@media (min-width:600px){#fight .gb{max-width:640px;margin:0 auto}#fight .esprite,#fight .msprite{max-width:36%}.roster .grid{grid-template-columns:repeat(5,1fr)!important}}

/* 돌진 연출 */
@keyframes lungeA{0%{transform:translate(0,0)}45%{transform:translate(46%,-42%) scale(1.06)}60%{transform:translate(40%,-36%) scale(1.02)}100%{transform:translate(0,0)}}
@keyframes lungeB{0%{transform:translate(0,0)}45%{transform:translate(-46%,42%) scale(1.06)}60%{transform:translate(-40%,36%) scale(1.02)}100%{transform:translate(0,0)}}
#fight .msprite.lunge{animation:lungeA .44s cubic-bezier(.3,.9,.4,1) both;z-index:3}
#fight .esprite.lunge{animation:lungeB .44s cubic-bezier(.3,.9,.4,1) both;z-index:3}
#fight .esprite.hit,#fight .msprite.hit{animation:shake .3s}
#fight .esprite.lunge.hit,#fight .msprite.lunge.hit{animation:lungeA .44s both}

/* ===== 규격 통일: 선 1.5px #1a1a1f(소환수 윤곽선과 같은 검정), 모서리 10px, 버튼 높이 56px(큰 것)·44px(작은 것) 두 가지만 ===== */
:root{--ln:1.5px;--lc:#1a1a1f;--rd:10px}
.cel,.tabs,.me,.ltabs,.rw,.rw.beat,.vsbox,.roster,.pt,.pt.op,.roster .pt,.tri .pt,.modes,.tip,.result .frame,.detail .frame,.sk,.skbar .sk,#fight .plate,#fight .tbox,#fight .log,.frame .x,.lhead .chip,.rw .won,.rw .av{border-width:var(--ln)!important;border-style:solid!important;border-color:var(--lc)!important;border-radius:var(--rd)!important}
.tri .pt{border-color:#4a9be0!important}.tri .pt.op{border-color:#e04f30!important}.roster .pt.on{border-color:#e04f30!important}
.tab+.tab,.ltabs button+button,.modes button+button{border-left:var(--ln) solid var(--lc)}
.pt .pinfo{border-top:var(--ln) solid var(--lc)}
#fight .bar,#fight .exp{border:var(--ln) solid var(--lc)}
#fight .effs span{border:1.5px solid var(--lc)}
#fight .chip{border:var(--ln) solid var(--lc)}
/* 버튼(H): 같은 선, 안쪽 흰 선, 아래 크림 띠. 주 버튼은 검정. 높이 56px */
.gmenu .gb,.gmenu .ib,.rw .gb,.setup .acts .gb,#fight .menu button,#fight .ctl button,.lhead .chip,#r_ok,#r_next{border:var(--ln) solid var(--lc)!important;border-radius:var(--rd)!important;background:#fffdf6!important;box-shadow:inset 0 0 0 2px #fff,inset 0 -4px 0 #e6e0d0!important;color:#1a1a1f!important;font-size:16px;letter-spacing:-.3px;font-weight:900;text-shadow:none;min-height:56px;padding:0 14px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.gmenu #btn_go{font-size:20px;letter-spacing:-.5px;min-height:56px}
.gmenu #btn_go,.rw .gb,#start,#r_ok,#r_next,#fight .menu button.pri,.lhead .chip.btn:not(:disabled){background:#1a1a1f!important;color:#fff!important;box-shadow:inset 0 0 0 2px #3a3a44,inset 0 -4px 0 #000!important}
.gmenu .gb:active,.gmenu .ib:active,.rw .gb:active,.setup .acts .gb:active,#fight .menu button:active{transform:translateY(2px)}
.lhead .chip{min-height:44px;font-size:13px;padding:0 14px}
.lhead .chip.btn:disabled{color:#9a9386!important}
.rw .gb{min-height:44px;min-width:76px}
#fight .ctl button{min-height:36px;height:36px;font-size:12px;padding:0 12px}
/* 전투 메뉴: 2열 같은 높이, 왼쪽 정렬, ▶ 없음 */
#fight .menu{gap:8px}
#fight .menu button{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;min-height:64px;padding:0 14px!important}
#fight .menu button::before{content:none!important}
#fight .menu button small{font-size:11px;font-weight:800;color:#6a6a78}
#fight .menu button.pri small{color:#c9c4b6}
#fight .menu button.pri small .el{background:#3a3a44;color:#fff;border-color:#5a5a64}
#fight .menu button.back{grid-column:1/3;align-items:center;min-height:48px;font-size:14px}
#fight .menu.list{grid-template-columns:1fr!important}
#fight .menu.list button.back{grid-column:1!important}
#fight .menu.list button{min-height:60px}
#fight .menu.list button small{white-space:normal}
/* 글상자·판 안 글자 정렬 */
#fight .tbox{padding:14px 16px}
#fight .tbox .msg{font-size:16px;line-height:1.5}
#fight .plate{padding:8px 12px 9px}
#fight .nm b{font-size:16px}
.tab,.ltabs button,.modes button{font-weight:900;letter-spacing:-.3px}

/* 전투: 하단 글상자 높이 고정(메뉴에 따라 전장이 오르내리지 않게), 조작 버튼은 위 오른쪽으로 크게 */
#fight .field{padding-top:calc(env(safe-area-inset-top) + 66px)!important;justify-content:flex-end!important;gap:36px!important}
#fight .ctl{position:absolute!important;top:calc(env(safe-area-inset-top) + 10px);right:12px;left:auto;bottom:auto;padding:0!important;gap:8px;z-index:8}
#fight .ctl button{min-height:44px!important;height:44px!important;font-size:14px!important;padding:0 14px!important;letter-spacing:-.3px}
#fight .log{top:calc(env(safe-area-inset-top) + 62px)}
#fight .tbox{height:228px!important;min-height:0!important;max-height:none!important;flex:none;overflow:hidden!important;padding:14px 16px!important}
#fight .menu{align-content:start}
#fight .menu button{min-height:56px!important}
#fight .menu button.back{min-height:44px!important}
#fight .menu.list button{min-height:44px!important}
#fight .menu.list button.back{min-height:44px!important}
#fight .menu button.cd{opacity:1!important;background:#e9e5d8!important;color:#8e8e9a!important;box-shadow:inset 0 0 0 2px #f3f0e7,inset 0 -4px 0 #d6d0c0!important}
#fight .menu button.cd small{color:#b3473a!important}
#fight .menu button.cd small .el{opacity:.55}
#fight .balls{position:relative}
#fight .fl{font-size:32px;top:-2%;animation-duration:1.4s}
#fight .balls .fl{top:-34px;font-size:22px}

/* 팀 구슬(빨간 점) 제거, 전투시작 버튼 두 줄 */
#fight .balls{display:none!important}
#fight .plate .fl{top:-30px;font-size:22px}
.setup .acts #start{flex-direction:column;gap:1px}
.setup .acts #start small{font-size:11px;font-weight:800;opacity:.8;line-height:1}

#fight .nm b{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.15}

/* 상세 팝업: 기술은 그림 대신 읽히는 목록 */
.detail .dbody{grid-template-columns:1fr!important;padding:18px 16px 20px!important}
.detail .art{height:200px}
.detail .st{grid-template-columns:repeat(4,auto 1fr);gap:4px 10px;font-size:14px}
.sks{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.skr{background:#fffdf6;border:var(--ln) solid var(--lc);border-radius:var(--rd);padding:10px 12px}
.skr .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.skr .h b{font-size:15px;font-weight:900;color:var(--ink)}
.skr .h .el{font-size:11px;font-weight:800;border:var(--ln) solid var(--lc);border-radius:999px;padding:0 7px;background:#fff;color:var(--ink)}
.skr .h small{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink2)}
.skr p{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--ink2);font-weight:600}

/* ===== 선 없음: UI는 선 대신 면과 옅은 그림자로 구분 (소환수만 윤곽선) ===== */
:root{--ln:0px;--sh:0 2px 8px rgba(20,22,30,.16)}
.cel,.tabs,.me,.ltabs,.rw,.rw.beat,.vsbox,.roster,.pt,.pt.op,.roster .pt,.tri .pt,.modes,.tip,.result .frame,.detail .frame,.sk,.skbar .sk,#fight .plate,#fight .tbox,#fight .log,.frame .x,.lhead .chip,.rw .won,.rw .av,.skr,.gmenu .gb,.gmenu .ib,.rw .gb,.setup .acts .gb,#fight .menu button,#fight .ctl button,#r_ok,#r_next,.vsbox .side .lab,.detail .stars,.pt.empty,.stage .u.empty,.cel-btn{border:none!important}
.tab+.tab,.ltabs button+button,.modes button+button{border-left:1px solid rgba(20,22,30,.1)!important}
.pt .pinfo{border-top:none!important}
.cel,.tabs,.me,.ltabs,.rw,.rw.beat,.vsbox,.roster,.modes,.tip,.result .frame,#fight .plate,#fight .tbox,#fight .log,.lhead .chip,.frame .x{box-shadow:var(--sh)!important}
.pt,.pt.op,.roster .pt,.tri .pt,.skr{box-shadow:0 1px 4px rgba(20,22,30,.14)!important}
.pt.empty,.stage .u.empty{background:rgba(255,255,255,.55)!important;box-shadow:inset 0 0 0 1.5px rgba(20,22,30,.18)!important}
.gmenu .gb,.gmenu .ib,.rw .gb,.setup .acts .gb,#fight .menu button,#fight .ctl button,#r_ok,#r_next{box-shadow:inset 0 -4px 0 #e6e0d0,var(--sh)!important}
.gmenu #btn_go,.rw .gb,#start,#r_ok,#r_next,#fight .menu button.pri,.lhead .chip.btn:not(:disabled){box-shadow:inset 0 -4px 0 #000,var(--sh)!important}
#fight .menu button.cd{box-shadow:inset 0 -4px 0 #d6d0c0!important}
.pt.on,.roster .pt.on{box-shadow:0 0 0 3px var(--acc2),0 1px 4px rgba(20,22,30,.14)!important}
#fight .bar,#fight .exp{border:none!important;background:#e3ddcd!important}
#fight .effs span,.skr .h .el,.vsbox .side .lab,.detail .stars{border:none!important;background:#efe9da!important}
.vsbox .side .lab.op,#op_lab{color:var(--acc2)!important}
.rw .av{background:#f3efe4!important}

/* 연승 표시는 버튼이 아니라 글자 */
.lhead .chip#streak{background:none!important;box-shadow:none!important;padding:0 2px!important;min-height:0!important;font-size:14px;color:var(--ink)}

/* 대전 준비: 이름 두 줄까지, 속성 빛 번짐 제거 */
.pt .pinfo b{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.2}
.pim img,.pim div,.pim svg,.stage .u img,.stage .u div,.rw .av img,.rw .av div,.detail .art img,.detail .art div{filter:none!important;animation:none!important}
.tri .pt .i{position:absolute;right:6px;top:6px;width:22px;height:22px;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;border-radius:999px;border:2px solid #fff;font-style:normal;font-weight:900}
.tri .pt .ld{left:6px;right:auto}

/* 대전 준비: 칸을 낮춰 아래 목록이 두 줄 보이게 */
.tri .pt .pim{aspect-ratio:auto!important;height:78px}
.roster .pt .pim{aspect-ratio:auto!important;height:80px}
.tri .pt.empty{aspect-ratio:auto!important;min-height:140px}
.pt .pinfo b{word-break:keep-all}
.pt .pinfo{padding:5px 8px 6px}

/* 전투: 글상자·체력 상자·조작 버튼을 같은 좌우 16px 선에 맞춤 */
#fight>.gb{margin:0!important;padding:env(safe-area-inset-top) 0 0!important;left:0!important;right:0!important;border:none!important;box-shadow:none!important;border-radius:0!important}
#fight .field{padding-left:16px!important;padding-right:16px!important;padding-bottom:14px!important}
#fight .rowA,#fight .rowB{margin:0!important;padding:0!important}
#fight .ebox,#fight .mbox{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;margin:0!important;transform:none}
#fight .tbox{margin:0 16px max(16px,env(safe-area-inset-bottom))!important}
#fight .ctl{right:16px!important}
@media (min-width:600px){#fight>.gb{max-width:640px!important;margin:0 auto!important}}

#fight .ctl button.on{background:#1a1a1f!important;color:#fff!important;box-shadow:inset 0 -4px 0 #000,var(--sh)!important}

/* 전투 위에 뜨는 글자: 피해 숫자는 크게, 상태는 작은 알약으로, 겹치면 위로 쌓임 */
#fight .fl{margin-top:calc(var(--k,0) * -30px)}
#fight .fl.tag{font-size:13px!important;font-weight:900;color:var(--ink)!important;background:#fffdf6;text-shadow:none!important;padding:3px 10px;border-radius:999px;box-shadow:0 2px 6px rgba(20,22,30,.22);letter-spacing:-.2px;animation:fltag 1.3s forwards}
@keyframes fltag{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,-8px)}100%{opacity:0;transform:translate(-50%,-14px)}}

/* 결과 창 제목: 그림자 없이 */
.result h2,#r_h{text-shadow:none!important;color:var(--ink)!important;background:none!important;-webkit-text-fill-color:currentColor!important;filter:none!important;font-size:30px;letter-spacing:-.5px}
.result.win h2,.result .win{color:var(--acc2)!important}

/* 효과 설명 창 */
#gloss .dbody{display:block!important;max-height:70vh;overflow:auto}
#gloss h4{margin:14px 2px 8px;font-size:13px;font-weight:900;color:var(--ink2)}
#gloss h4:first-child{margin-top:0}
#gloss .skr{margin-bottom:6px}
#gloss .skr.bad .h b{color:#c0392b}
#gloss .skr.good .h b{color:#1e8a4a}
#fight .ctl #c_help{width:44px;padding:0!important;font-size:18px!important}
#fight .effs{cursor:pointer}
/* 전투 기록 줄: 승패는 왼쪽 알약 하나 */
.rw.rec{display:flex;align-items:center;gap:12px;opacity:1!important}
.rw.rec .wl{flex:none;width:52px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;background:var(--acc2)}
.rw.rec.l .wl{background:#8e8e9a}
.rw.rec .inf{flex:1;min-width:0}
.rw.rec .inf small{display:block;line-height:1.4;word-break:keep-all}
.rw.rec .rec{flex:none;text-align:right;font-size:11px;font-weight:800;color:var(--ink2);line-height:1.5}
/* 결과 창 제목: 색 알약 */
#r_h{display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:46px;padding:0 22px;border-radius:999px;background:var(--acc2)!important;color:#fff!important;-webkit-text-fill-color:#fff!important;font-size:22px!important}
#r_h.lose{background:#8e8e9a!important}

/* 결과 창: 승패 알약 → 승점 변동 크게 → 설명 → 확인 */
.me i{font-style:normal}
.result .frame{text-align:center;padding:26px 20px 18px!important}
.result #r_p{margin:10px 0 0;font-size:14px;font-weight:700;color:var(--ink2)}
.result .pts{margin:14px auto 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.result .pts b{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.result .pts.up b{color:var(--acc2)}
.result .pts.down b{color:#5a6070}
.result .pts small{font-size:13px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
.result .drop{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;padding:10px 14px;background:#fffdf6;border-radius:var(--rd);box-shadow:0 1px 4px rgba(20,22,30,.14);font-weight:900;font-size:15px;color:var(--ink);width:max-content;max-width:100%}
.result .drop img{width:40px;height:40px;object-fit:contain;flex:none;margin:0}
.result .acts{margin-top:18px}

/* 로비 이름: 번지는 그림자 대신 작은 알약 */
.stage .u .nm{text-shadow:none!important;background:#fffdf6;color:var(--ink)!important;padding:2px 9px;border-radius:999px;box-shadow:0 1px 4px rgba(20,22,30,.2);font-weight:900}
/* 던전 층 목록 */
.rw.floor{display:flex;align-items:center;gap:12px;opacity:1!important}
.rw.floor .fno{flex:none;width:48px;height:48px;border-radius:12px;background:#efe9da;display:flex;align-items:baseline;justify-content:center;padding-top:10px;color:var(--ink)}
.rw.floor .fno b{font-size:20px;font-weight:900;line-height:1}
.rw.floor .fno small{font-size:11px;font-weight:800;margin-left:1px}
.rw.floor .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rw.floor .inf b{font-size:14px;font-weight:900;color:var(--ink)}
.rw.floor .inf small{font-size:12px;font-weight:700;color:var(--ink2);line-height:1.35}
.rw.floor .inf .rwd{color:#8a5a10}
.rw.floor .gb{flex:none}
.rw.floor .lock{flex:none;font-size:13px;font-weight:900;color:#9a9aa6;min-width:76px;text-align:center}
.rw.floor.locked{background:#f1ede3!important}
.rw.floor.locked .fno{background:#e3ddcd;color:#9a9aa6}
.rw.floor.locked .inf b,.rw.floor.locked .inf small{color:#9a9aa6}

.result .acts:has(#r_next:not(.hidden)) #r_ok{background:#fffdf6!important;color:var(--ink)!important;box-shadow:inset 0 -4px 0 #e6e0d0,var(--sh)!important}

/* ===== 전투 이펙트 ===== */
#fight .esprite>div,#fight .msprite>div{position:relative}
.fxa,.stl{position:absolute;inset:0;pointer-events:none;z-index:4}
.fxa svg,.sx svg{width:100%;height:100%;display:block;overflow:visible}
.fxa.slash{inset:10%;animation:fxSlash .6s ease-out forwards}
@keyframes fxSlash{0%{opacity:0;transform:scale(.6) rotate(-8deg);clip-path:inset(0 100% 0 0)}25%{opacity:1;clip-path:inset(0 0 0 0)}70%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.1)}}
.fxa.impact{inset:18%;animation:fxPop .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes fxPop{0%{opacity:0;transform:scale(.2) rotate(-20deg)}30%{opacity:1;transform:scale(1.1) rotate(0)}70%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.fxa.magic>svg{position:absolute;inset:22%;width:56%;height:56%;animation:fxRing .6s ease-out forwards}
@keyframes fxRing{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.fxa i{position:absolute;left:50%;top:50%;width:18%;height:18%;margin:-9% 0 0 -9%}
.fxa.magic i,.fxa.curse i{animation:fxOut .6s ease-out forwards}
@keyframes fxOut{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-210%) scale(1)}}
.fxa.curse i{animation-name:fxIn}
@keyframes fxIn{0%{opacity:0;transform:rotate(var(--a)) translateY(-230%) scale(1)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.3)}}
.fxa.boost i,.fxa.heal i{left:var(--x);top:auto;bottom:10%;margin:0;width:16%;height:16%;opacity:0;animation:fxUp .7s ease-out var(--dl) forwards}
@keyframes fxUp{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-260%) scale(1)}}
/* 상태 */
.sx{position:absolute;inset:0}
.sx i{position:absolute;display:block}
.sx.burn i{width:20%;height:20%;bottom:4%;left:calc(18% + var(--i)*24%);transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.17s)}
@keyframes flick{0%{transform:scale(.9,.85)}100%{transform:scale(1.05,1.12)}}
.sx.poison i{width:13%;height:13%;bottom:20%;left:calc(20% + var(--i)*25%);animation:rise 1.6s ease-in infinite;animation-delay:calc(var(--i)*-.55s)}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-280%) scale(1.1)}}
.sx.bleed i{width:11%;height:11%;top:34%;left:calc(30% + var(--i)*34%);animation:fall 1.3s ease-in infinite;animation-delay:calc(var(--i)*-.65s)}
@keyframes fall{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(260%)}}
.sx.frost{background:radial-gradient(ellipse at 50% 85%,rgba(160,220,255,.45),rgba(160,220,255,0) 65%)}
.sx.frost i{width:15%;height:22%;bottom:3%;left:calc(14% + var(--i)*20%)}
.sx.frost i:nth-child(even){height:16%}
.sx.shock i{width:22%;height:22%;top:calc(24% + var(--i)*26%);left:calc(4% + var(--i)*70%);animation:zap .35s steps(2) infinite;animation-delay:calc(var(--i)*-.17s)}
@keyframes zap{0%{opacity:1;transform:rotate(-8deg)}100%{opacity:.15;transform:rotate(8deg) scale(.85)}}
.sx.stun b{position:absolute;left:25%;right:25%;top:-4%;height:16%;animation:orbit 1.4s linear infinite}
.sx.stun i{width:34%;height:100%;left:calc(var(--i)*33%);top:calc(var(--i)%2*30%)}
@keyframes orbit{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.sx.sleep i{width:14%;height:14%;top:8%;right:calc(4% + var(--i)*8%);opacity:0;animation:zz 2.1s ease-out infinite;animation-delay:calc(var(--i)*.7s)}
@keyframes zz{0%{opacity:0;transform:translate(0,30%) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(60%,-180%) scale(1.2)}}
.sx.slow i{left:12%;right:12%;bottom:2%;height:12%;border-radius:50%;border:3px solid #6fb8ff;box-shadow:0 0 0 2px #1a1a1f;animation:ripple 1.6s ease-out infinite}
.sx.slow i+i{animation-delay:-.8s}
@keyframes ripple{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.15)}}
.sx.silence i{width:22%;height:22%;top:2%;right:6%;animation:bob 1.2s ease-in-out infinite}
.sx.blind{background:radial-gradient(ellipse 46% 20% at 50% 32%,rgba(40,36,60,.78),rgba(40,36,60,.45) 60%,rgba(40,36,60,0) 100%);animation:haze 2s ease-in-out infinite alternate}
@keyframes haze{0%{transform:translateX(-4%)}100%{transform:translateX(4%)}}
.sx.fear i{width:13%;height:13%;top:14%;right:22%;animation:sweat 1.4s ease-in infinite}
@keyframes sweat{0%{opacity:0;transform:translateY(-20%)}20%{opacity:1}100%{opacity:0;transform:translateY(120%)}}
.sx.web{inset:6%;opacity:.95}
.sx.rage{background:radial-gradient(ellipse 45% 45% at 50% 58%,rgba(255,80,60,.35),rgba(255,80,60,0) 70%);animation:pulse .7s ease-in-out infinite alternate}
.sx.rage i{width:18%;height:18%;top:6%;right:12%}
@keyframes pulse{0%{opacity:.6}100%{opacity:1}}
.sx.shield,.sx.guard{inset:4% 6% 0;border-radius:50%;border:3px solid #8fd2ff;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(143,210,255,.18) 45%,rgba(143,210,255,.08) 70%);box-shadow:0 0 0 2px rgba(26,26,31,.55);animation:pulse 1.2s ease-in-out infinite alternate}
.sx.guard{border-color:#ffd25a;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),rgba(255,210,90,.16) 45%,rgba(255,210,90,.06) 70%)}
.sx.shield+.sx.guard{inset:0 2% -4%}
.sx.regen i{width:12%;height:12%;bottom:12%;left:calc(18% + var(--i)*26%);animation:rise 1.8s ease-out infinite;animation-delay:calc(var(--i)*-.6s)}
#fight .esprite.down .stl,#fight .msprite.down .stl{display:none}

/* 골드식 조정: 타격 그림은 작게, 맞으면 깜빡, 피하면 옆으로 */
.fxa.slash{inset:24%!important}
.fxa.impact{inset:30%!important}
.fxa.magic>svg{inset:32%!important;width:36%!important;height:36%!important}
.fxa i{width:13%!important;height:13%!important;margin:-6.5% 0 0 -6.5%!important}
.fxa.boost i,.fxa.heal i{margin:0!important}
#fight .esprite.blink>div>:not(.fxa):not(.stl):not(.fl),#fight .msprite.blink>div>:not(.fxa):not(.stl):not(.fl){animation:blink .48s steps(1) both}
@keyframes blink{0%,32%,64%{opacity:0}16%,48%,80%,100%{opacity:1}}
#fight .esprite.dodge,#fight .msprite.dodge{animation:dodge .42s ease-out}
@keyframes dodge{0%{transform:translateX(0)}35%{transform:translateX(-14%)}100%{transform:translateX(0)}}
#fight .msprite.dodge{animation-name:dodgeB}
@keyframes dodgeB{0%{transform:translateX(0)}35%{transform:translateX(14%)}100%{transform:translateX(0)}}
/* 보호막(리플렉터식): 앞에 투명한 판이 서고 두 번 번쩍 */
.sx.shield,.sx.guard{inset:0!important;border:none!important;background:none!important;box-shadow:none!important;border-radius:0!important;animation:none!important}
.sx.shield i,.sx.guard i{position:absolute;left:14%;right:14%;top:14%;bottom:6%;border-radius:14px;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.85) 40%,rgba(255,255,255,0) 48%),rgba(150,215,255,.38);border:2px solid rgba(26,26,31,.75);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);transform:perspective(300px) rotateY(-14deg);animation:screen 1.1s ease-out both}
.msprite .sx.shield i,.msprite .sx.guard i{transform:perspective(300px) rotateY(14deg)}
.sx.guard i{background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.85) 40%,rgba(255,255,255,0) 48%),rgba(255,214,110,.38)}
@keyframes screen{0%{opacity:0;clip-path:inset(100% 0 0 0)}20%{opacity:1;clip-path:inset(0 0 0 0)}30%{filter:brightness(1.6)}40%{filter:brightness(1)}55%{filter:brightness(1.6)}65%{filter:brightness(1)}85%{opacity:1}100%{opacity:0}}
.stl.once .sx.web{animation:fadeio 1.1s both}
.stl.once .sx.blind,.stl.once .sx.rage,.stl.once .sx.frost{animation:fadeio 1.1s both}
@keyframes fadeio{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ===== 이펙트: 덧그림 없이 소환수 그림의 빛·색만 바꾼다 (골드 버전의 팔레트 깜빡임 방식) ===== */
.fxa,.stl{display:none!important}
#fight .esprite>div>:not(.fl),#fight .msprite>div>:not(.fl){transform-origin:50% 90%}
/* 타격 */
#fight [class*="fx-slash"]>div>:not(.fl){animation:fxFlash .5s steps(1) both}
@keyframes fxFlash{0%,40%{filter:brightness(2.6) saturate(.2)}20%,60%,100%{filter:none}}
#fight [class*="fx-impact"]>div>:not(.fl){animation:fxSmash .6s ease-out both}
@keyframes fxSmash{0%{filter:brightness(2.8) saturate(.2);transform:scale(1.06,.92)}15%{filter:none;transform:scale(.97,1.04)}30%{filter:brightness(2.4) saturate(.2)}45%{filter:none;transform:none}100%{filter:none}}
#fight [class*="fx-magic"]>div>:not(.fl){animation:fxMagic .62s ease-out both}
@keyframes fxMagic{0%{filter:brightness(1)}20%{filter:brightness(1.9) drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 4px var(--c))}40%{filter:brightness(1.1) drop-shadow(0 0 6px var(--c))}60%{filter:brightness(1.8) drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 4px var(--c))}100%{filter:none}}
#fight [class*="fx-curse"]>div>:not(.fl){animation:fxCurse .62s ease-out both}
@keyframes fxCurse{0%{filter:none}30%,60%{filter:brightness(.7) drop-shadow(0 0 10px var(--c))}45%{filter:brightness(.9) drop-shadow(0 0 4px var(--c))}100%{filter:none}}
#fight [class*="fx-boost"]>div>:not(.fl){animation:fxBoost .62s ease-out both}
@keyframes fxBoost{0%{filter:none}30%,70%{filter:brightness(1.35) drop-shadow(0 0 10px #ffd65a)}50%{filter:brightness(1.1) drop-shadow(0 0 4px #ffd65a)}100%{filter:none}}
#fight [class*="fx-heal"]>div>:not(.fl){animation:fxHeal .62s ease-out both}
@keyframes fxHeal{0%{filter:none}30%,70%{filter:brightness(1.3) drop-shadow(0 0 10px #7be38a)}50%{filter:brightness(1.1) drop-shadow(0 0 4px #7be38a)}100%{filter:none}}
/* 상태 (걸릴 때·효과가 들 때 한 번) */
#fight [class*="st-burn"]>div>:not(.fl){animation:stBurn 1.1s ease-in-out both}
@keyframes stBurn{0%,100%{filter:none}25%,75%{filter:sepia(.9) saturate(3.2) hue-rotate(-25deg) brightness(1.05) drop-shadow(0 4px 8px rgba(255,110,40,.8))}50%{filter:sepia(.4) saturate(1.8) hue-rotate(-25deg)}}
#fight [class*="st-poison"]>div>:not(.fl){animation:stPoison 1.1s ease-in-out both}
@keyframes stPoison{0%,100%{filter:none}25%,75%{filter:sepia(.8) saturate(2.6) hue-rotate(225deg) brightness(.9)}50%{filter:sepia(.3) saturate(1.5) hue-rotate(225deg)}}
#fight [class*="st-bleed"]>div>:not(.fl){animation:stBleed .9s steps(1) both}
@keyframes stBleed{0%,50%{filter:sepia(1) saturate(4) hue-rotate(-40deg) brightness(.9)}25%,75%,100%{filter:none}}
#fight [class*="st-frost"]>div>:not(.fl){animation:stFrost 1.1s ease-out both}
@keyframes stFrost{0%{filter:none}30%,80%{filter:saturate(.25) brightness(1.35) hue-rotate(170deg) drop-shadow(0 0 8px #bfe8ff)}100%{filter:none}}
#fight [class*="st-shock"]>div>:not(.fl){animation:stShock .9s steps(1) both}
@keyframes stShock{0%,30%,60%{filter:sepia(1) saturate(5) hue-rotate(5deg) brightness(1.5)}15%,45%,75%{filter:grayscale(1) brightness(1.2)}90%,100%{filter:none}}
#fight [class*="st-sleep"]>div>:not(.fl){animation:stSleep 1.1s ease-in-out both}
@keyframes stSleep{0%,100%{filter:none;transform:none}35%{filter:brightness(.6) saturate(.6);transform:scale(1.03,.95)}70%{filter:brightness(.65) saturate(.6);transform:scale(1,1)}}
#fight [class*="st-stun"]>div>:not(.fl){animation:stStun .9s ease-in-out both}
@keyframes stStun{0%,100%{transform:none;filter:none}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg);filter:brightness(1.3)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
#fight [class*="st-fear"]>div>:not(.fl){animation:stFear .8s linear both}
@keyframes stFear{0%,100%{transform:none;filter:none}10%,30%,50%,70%{transform:translateX(-3%);filter:brightness(.8) saturate(.6)}20%,40%,60%,80%{transform:translateX(3%)}}
#fight [class*="st-blind"]>div>:not(.fl){animation:stBlind 1.1s ease-in-out both}
@keyframes stBlind{0%,100%{filter:none}30%,70%{filter:brightness(.4) contrast(.8)}}
#fight [class*="st-web"]>div>:not(.fl),#fight [class*="st-silence"]>div>:not(.fl){animation:stGray 1.1s ease-in-out both}
@keyframes stGray{0%,100%{filter:none}30%,70%{filter:grayscale(.9) brightness(1.1)}}
#fight [class*="st-slow"]>div>:not(.fl){animation:stSlow 1.1s ease-in-out both}
@keyframes stSlow{0%,100%{filter:none;transform:none}40%,70%{filter:sepia(.6) saturate(2) hue-rotate(170deg) brightness(.95);transform:scale(1,.97)}}
#fight [class*="st-rage"]>div>:not(.fl){animation:stRage .9s ease-in-out both}
@keyframes stRage{0%,100%{filter:none}25%,75%{filter:saturate(1.6) drop-shadow(0 0 12px #ff4a3a)}50%{filter:saturate(1.2) drop-shadow(0 0 4px #ff4a3a)}}
#fight [class*="st-shield"]>div>:not(.fl){animation:stShield 1.1s ease-out both}
@keyframes stShield{0%,100%{filter:none}20%,60%{filter:brightness(1.35) drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px #6cc4ff)}40%,80%{filter:brightness(1.1) drop-shadow(0 0 6px #6cc4ff)}}
#fight [class*="st-guard"]>div>:not(.fl){animation:stGuard 1.1s ease-out both}
@keyframes stGuard{0%,100%{filter:none}20%,60%{filter:brightness(1.3) drop-shadow(0 0 3px #fff) drop-shadow(0 0 12px #ffc83a)}40%,80%{filter:brightness(1.1) drop-shadow(0 0 6px #ffc83a)}}
#fight [class*="st-regen"]>div>:not(.fl){animation:stRegen 1.1s ease-out both}
@keyframes stRegen{0%,100%{filter:none}30%,70%{filter:brightness(1.25) drop-shadow(0 0 10px #7be38a)}50%{filter:brightness(1.05) drop-shadow(0 0 4px #7be38a)}}
</style>
</head>
<body>
<div id="app">

<!-- 로비 -->
<div id="lobby" class="scene bg-lobby">
  <div class="hud">
    <div class="tabs"><a class="tab" id="tab_a" href="battle.html">아레나</a><a class="tab" id="tab_d" href="battle.html?mode=dungeon">던전</a></div>
    <div class="me"><b id="me_nick">소환사</b><div class="ro"><span><i id="me_pwl">전투력</i> <span id="me_pw">0</span></span><span><i id="me_winl">승점</i> <span id="me_win">0</span></span></div><div class="ro" id="atk_row"><span>입장권 <span id="atk_n">10</span>/10</span><span id="atk_t" style="font-weight:600;opacity:.75"></span></div></div>
  </div>
  <div class="timer" id="lobby_timer"></div>
  <div class="stage" id="stage"></div>
  <div class="gmenu">
    <button class="gb orange" id="btn_go">대전하기</button>
    <button class="gb green" id="btn_rival">라이벌<span class="badge" id="rival_n">0</span></button>
    <button class="ib" id="bb_def">방어덱</button>
    <button class="ib" id="bb_rec">전투 기록</button>
    <button class="ib" id="bb_info">랭킹</button>
    <a class="ib back" href="index.html">나가기</a>
  </div>
</div>

<!-- 상대 목록 -->
<div id="list" class="modal hidden">
  <div class="frame">
    <div class="ttl" id="list_ttl">아레나</div>
    <button class="x" id="list_x">✕</button>
    <div class="body">
      <div class="ltabs" id="ltabs">
        <button data-t="match" class="on">대전</button>
        <button data-t="rival">라이벌<span class="badge" id="rival_n2">0</span></button>
        <button data-t="rec">전투 기록</button>
        <button data-t="rank">랭킹</button>
      </div>
      <div class="lmain">
        <div class="lhead"><span class="chip" id="streak">연승 없음</span><button class="chip btn" id="refresh">리스트 갱신</button></div>
        <div class="rows" id="rows"></div>
      </div>
    </div>
  </div>
</div>

<!-- 대전 준비 -->
<div id="setup" class="setup hidden">
  <div class="top"><span id="setup_ttl"><b>대전 준비</b></span><span id="setup_sub"></span></div>
  <div class="vsbox">
    <div class="side"><span class="lab me">내 공격덱</span><div class="tri" id="my_tri"></div></div>
    <div class="vs">VS</div>
    <div class="side"><span class="lab op" id="op_lab">상대 방어덱</span><div class="tri" id="op_tri"></div></div>
  </div>
  <div class="roster"><div class="grid" id="roster"></div></div>
  <div class="acts">
    <div class="modes" id="modes"><button data-m="auto" class="on">자동</button><button data-m="manual">수동</button><button data-m="both">둘 다 수동</button></div>
    <button class="gb" id="start">전투시작</button>
    <button class="gb wood" id="cancel">전투취소</button>
  </div>
</div>

<!-- 상세 -->
<div id="detail" class="detail hidden">
  <div class="frame">
    <div class="ttl" id="d_ttl"></div>
    <button class="x" id="d_x">✕</button>
    <div class="dbody">
      <div>
        <div class="art" id="d_art"><div class="stars" id="d_stars"></div><div class="ty" id="d_ty"></div></div>
        <div class="st" id="d_st"></div>
      </div>
      <div class="sks" id="d_sks"></div>
    </div>
  </div>
</div>
<div id="tip" class="tip hidden"></div>
<div id="gloss" class="detail hidden"><div class="frame"><div class="ttl">효과 설명</div><button class="x" id="g_x">✕</button><div class="dbody" id="g_body"></div></div></div>

<!-- 전투 (골드 버전식: 상대는 오른쪽 위, 나는 왼쪽 아래, 아래는 글상자) -->
<div id="fight" class="scene hidden">
  <div class="gb">
    <div class="field">
      <div class="rowA">
        <div class="col">
          <div class="balls" id="e_team"></div>
          <div class="plate ebox"><div class="nm"><b id="e_nm"></b><span id="e_lv"></span></div><div class="bar"><i id="e_hp"></i></div><div class="sub"><span class="hpn" id="e_hpn"></span><span class="exp"><i id="e_tg"></i></span></div><div class="effs" id="e_eff"></div></div>
        </div>
        <div class="esprite" id="e_sp"></div>
      </div>
      <div class="rowB">
        <div class="msprite" id="m_sp"></div>
        <div class="col">
          <div class="balls" id="m_team"></div>
          <div class="plate mbox"><div class="nm"><b id="m_nm"></b><span id="m_lv"></span></div><div class="bar"><i id="m_hp"></i></div><div class="sub"><span class="hpn" id="m_hpn"></span><span class="exp"><i id="m_tg"></i></span></div><div class="effs" id="m_eff"></div></div>
        </div>
      </div>
    </div>
    <div class="ctl"><button id="c_help" aria-label="효과 설명">?</button><button id="c_log">전투기록</button><button id="c_spd">속도 ×1</button><button id="c_auto">자동</button></div>
    <div class="tbox"><div class="msg" id="cap"></div><div class="menu hidden" id="menu"></div></div>
  </div>
  <div class="log hidden" id="log"></div>
  <div class="skbar hidden" id="skbar"></div>
</div>

<!-- 결과 -->
<div id="result" class="result hidden">
  <div class="frame">
    <h2 id="r_h">승리</h2>
    <div id="r_drop"></div>
    <p id="r_p"></p>
    <div class="acts"><button class="gb" id="r_ok">확인</button><button class="gb orange hidden" id="r_next">다음 층</button></div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script src="game.js?v=32"></script>
<script>
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
const UNDEAD=new Set(["스켈레톤","유령","뱀파이어","임프"]);
const HOLY=new Set(["빛의 심판","심판"]);
const MAGICAL=new Set(["mana","divine","spirit"]);
const BAD=new Set(["stun","sleep","web","burn","bleed","poison","frost","shock","slow","silence","blind","fear"]);
const TURN=240, MAXSPD=120;
let MODE="auto", SPD=1;
const GAME=new URLSearchParams(location.search).get("mode")==="dungeon"?"dungeon":"arena";
let FLOOR=1;
const MAXFLOOR=10;
const REFRESH_MS=10*60*1000; // 리스트 갱신 쿨타임
function floorEnemyCount(f){return f<=2?1:f<=6?2:3}
function floorStage(f){return f<=3?1:f<=7?2:3}
function floorScale(f){return 1+0.10*(f-1)}
function floorReward(f){return f<=6?"low":"high"}
function fragOnly(f){return f<=2}
function todayStr(){return new Date().toISOString().slice(0,10)}
function claimedToday(f){const c=rec().claimed||{};return c[f]===todayStr()}
const SKICON={hit:"⚔️",debuff:"🌀",buff:"🛡️",heal:"💚"};

function aff(att,def){return 1+(traitAdv(att,def)+elemAdv(att.elem,def.elem))/100}
function cur(f){

function say(side,html,cls=""){

function dmgTo(att,def,raw,label,skill){
 if(def.eff.sleep){delete def.eff.sleep}
 let d=raw; if(def.guard)d*=(1-GUARD); if(def.shield>0){d*=0.5;def.shield--}
 d=Math.max(1,Math.floor(d)); def.hp=Math.max(0,def.hp-d);
 say(att.side,`<b>${att.name}</b> → ${def.name}에게 ${label}. <span class="dmg">-${d}</span>${skill?` <span class="eff">${skill}</span>`:""}${def.hp<=0?`<br><span class="eff">${def.name}${iga(def.name)} 쓰러졌어요.</span>`:""}`);
 const el=def===FOCUS[def.side]?$(def.side==="a"?"m_sp":"e_sp"):chipOf(def); if(el){el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),300)} float(def,"-"+d);
 return d;
}
function applyEff(att,def,e){
 if(!e)return;
 if(e==="random")e=["stun","burn","bleed","slow"][Math.floor(rnd()*4)];
 const name=EFF[e][0];
 if(e==="heal"){const v=Math.round(att.maxhp*0.3*(att.eff.bleed?0.5:1));att.hp=Math.min(att.maxhp,att.hp+v);say(att.side,`<b>${att.name}</b> 회복 <span class="heal">+${v}</span>`);float(att,"+"+v,"heal");return}
 if(e==="cleanse"){Object.keys(att.eff).forEach(k=>{if(BAD.has(k))delete att.eff[k]});say(att.side,`<b>${att.name}</b>의 나쁜 효과가 사라졌어요.`);hitFx(att,"heal",att.elem);return}
 if(e==="shield"){att.shield=2;say(att.side,`<b>${att.name}</b>에게 보호막.`);playSt(att,"shield");return}
 if(e==="guard"){att.eff.guard=3;say(att.side,`<b>${att.name}</b> 방어 상승 3턴.`);playSt(att,"guard");return}
 if(e==="regen"){att.eff.regen=3;say(att.side,`<b>${att.name}</b> 재생 3턴.`);playSt(att,"regen");return}
 if(e==="rage"){att.eff.rage=3;say(att.side,`<b>${att.name}</b> 광폭 3턴.`);playSt(att,"rage");return}
 if(e==="drain")return;
 if(["stun","sleep","frost"].includes(e)&&(def.eff.stun||def.eff.sleep||def.eff.frost))return;
 const dur={stun:1,sleep:2,web:2,burn:3,bleed:3,poison:4,frost:1,shock:2,slow:2,silence:2,blind:2,fear:2}[e];
 def.eff[e]=dur+1;
 if(e==="burn")def.dot.burn=Math.round(cur(att)[1]*0.3);

}
function startTurn(f){
 f.turns++;
 if(f.eff.burn){f.hp=Math.max(0,f.hp-f.dot.burn);say(f.side,`<b>${f.name}</b> 화상 <span class="dmg">-${f.dot.burn}</span>`);playSt(f,"burn");float(f,"-"+f.dot.burn)}
 if(f.eff.bleed){const v=Math.round(f.maxhp*0.05);f.hp=Math.max(0,f.hp-v);say(f.side,`<b>${f.name}</b> 출혈 <span class="dmg">-${v}</span>`);playSt(f,"bleed");float(f,"-"+v)}
 if(f.eff.poison){const v=Math.round(f.maxhp*0.06);f.hp=Math.max(0,f.hp-v);say(f.side,`<b>${f.name}</b> 중독 <span class="dmg">-${v}</span>`);playSt(f,"poison");float(f,"-"+v)}
 if(f.eff.regen&&f.hp>0){const v=Math.round(f.maxhp*0.1*(f.eff.bleed?0.5:1));f.hp=Math.min(f.maxhp,f.hp+v);say(f.side,`<b>${f.name}</b> 재생 <span class="heal">+${v}</span>`);playSt(f,"regen");float(f,"+"+v,"heal")}
 f.skills.forEach(s=>{if(s.cd>0)s.cd--});
 if(f.hp<=0){say(f.side,`<b>${f.name}</b> 쓰러졌어요.`);return false}
 return true;
}
function endTurn(f){for(const k of Object.keys(f.eff)){f.eff[k]--; if(f.eff[k]<=0){delete f.eff[k]; if(k==="frost")f.eff.frostslow=3}}}
function cannotAct(att){
 if(att.eff.shock&&rnd()<0.3)return `<b>${att.name}</b> 감전으로 몸이 굳었어요.`;
 if(att.eff.stun)return `<b>${att.name}</b> 기절 중. 못 움직여요.`;
 if(att.eff.frost)return `<b>${att.name}</b> 얼어 있어요.`;
 if(att.eff.sleep)return `<b>${att.name}</b> 자고 있어요.`;
