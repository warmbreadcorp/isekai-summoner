function bestTarget(att,enemies){
 const score=e=>(traitAdv(att,e)+elemAdv(att.elem,e.elem))*10-(e.hp/e.maxhp);
 return alive(enemies).slice().sort((a,b)=>score(b)-score(a))[0];
}
function aiDecide(att,enemies){
 const target=bestTarget(att,enemies);
 const ready=att.skills.filter(s=>s.cd===0&&!att.eff.silence);
 const low=att.hp<att.maxhp*0.35;
 let pick=null;
 if(low)pick=ready.find(s=>s.t==="heal"||s.t==="buff");
 if(!pick){const h=ready.filter(s=>s.t==="hit"||s.t==="debuff").sort((a,b)=>b.tier-a.tier);pick=h[0]||null}
 if(!pick&&ready.length&&rnd()<0.5)pick=ready[0];
 if(!pick&&att.hp<att.maxhp*0.4&&rnd()<0.35)return {type:"guard"};
 return pick?{type:"skill",skill:pick,target:(pick.t==="hit"||pick.t==="debuff")?target:att}:{type:"basic",target};
}
function perform(att,action){
 att.guard=false;
 if(action.type==="guard"){att.guard=true;say(att.side,`<b>${att.name}</b> 방어 자세.`);playSt(att,"guard");return}
 const def=action.target;
 const [,atk,mag]=cur(att), ddef=cur(def)[4];
 const useStat=(s)=>(s&&MAGICAL.has(att.pow))?mag:atk;
 const tryHit=(mult,label,eff,skill)=>{
  if(!def.eff.web&&rnd()<DODGE){say(att.side,`<b>${att.name}</b>의 ${label}. ${def.name}${iga(def.name)} 피했어요.`);spriteAnim(def,"dodge",420);return}
  if(att.eff.blind&&rnd()<0.5){say(att.side,`<b>${att.name}</b>의 ${label}. 앞이 안 보여 빗나갔어요.`);spriteAnim(def,"dodge",420);return}
  let raw=useStat(skill)*mult*100/(100+ddef)*aff(att,def);
  if(skill&&HOLY.has(label)&&UNDEAD.has(def.race.n))raw*=2;
  const advp=traitAdv(att,def)+elemAdv(att.elem,def.elem);
  hitFx(def,!skill?"slash":MAGICAL.has(att.pow)?"magic":"impact",att.elem);
  const d=dmgTo(att,def,raw,label,advp?(advp>0?"상성 유리":"상성 불리"):"");
  if(eff==="drain"){const v=Math.round(d*0.5*(att.eff.bleed?0.5:1));att.hp=Math.min(att.maxhp,att.hp+v);say(att.side,`<b>${att.name}</b> 흡혈 <span class="heal">+${v}</span>`);float(att,"+"+v,"heal")}
  else if(def.hp>0)applyEff(att,def,eff);
 };
 if(action.type==="skill"){
  const p=action.skill; p.cd=p.tier+1;
  if(p.t==="hit")tryHit(p.m,p.n,p.e,true);
  else{say(att.side,`<b>${att.name}</b>의 ${p.n}.`);if(p.t==="debuff")hitFx(def,"curse",att.elem);else hitFx(att,p.t==="heal"||p.e==="heal"||p.e==="regen"?"heal":"boost",att.elem);applyEff(att,def,p.e)}
 }else tryHit(att.basic,"일반공격",null,false);
}
let PAUSED=false;
const sleep=ms=>new Promise(r=>setTimeout(function w(){if(PAUSED)return setTimeout(w,120);r()},ms/SPD));
/* 돌진: 행동하는 쪽 그림만 상대 쪽으로 갔다가 돌아온다. 치는 순간(절반 지점)에 resolve */
function lunge(f){const el=$(f.side==="a"?"m_sp":"e_sp");if(!el||FOCUS[f.side]!==f)return sleep(0);el.style.animationDuration=(440/SPD)+"ms";el.classList.remove("lunge");void el.offsetWidth;el.classList.add("lunge");setTimeout(()=>el.classList.remove("lunge"),460/SPD);return sleep(230)}
/* 수동 선택: 아래 스킬 버튼 + 적 터치로 대상 */
function askPlayer(att,enemies){
 return new Promise(res=>{
  const menu=$("menu"); menu.classList.remove("hidden");
  TARGET=bestTarget(att,enemies); markTargets(enemies);
  const ready=att.skills.map(s=>({s,ok:s.cd===0&&!att.eff.silence}));
  const dmgOf=(s)=>showDmg(MAGICAL.has(att.pow)&&s?cur(att)[2]:cur(att)[1],s?s.m:att.basic);
  const done=(a)=>{menu.classList.add("hidden");clearTargets();$("tip").classList.add("hidden");res(a)};
  const tipFor=(k)=>{
   if(k==="basic")return `<b>일반공격</b>적 하나를 때려요. 데미지 ${dmgOf(null)}.`;
   const {s,ok}=ready[+k.slice(1)];
   return `<b>${s.n}</b>${s.d||""}${s.t==="hit"?` 데미지 ${dmgOf(s)}.`:""}<div class="cd">${s.tier}단계 스킬 · 쿨타임 ${s.tier}턴${ok?"":" · "+s.cd+"턴 뒤 사용 가능"}${att.eff.silence?" · 침묵 중":""}</div>`;
  };
  const main=()=>{
   menu.className="menu main";
   menu.innerHTML=`<button class="pri" data-k="fight">싸우다</button><button data-k="target">대상<small>${TARGET?TARGET.name:""}</small></button><button data-k="guard">방어<small>피해 ${GUARD*100}% 감소</small></button><button data-k="auto">자동으로</button>`;
   menu.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(k==="fight")return moves(); if(k==="guard")return done({type:"guard"}); if(k==="target")return targets();
    if(k==="auto"){MODE="auto";$("c_auto").classList.add("on");return done(aiDecide(att,enemies))}});
  };
  const moves=()=>{
   menu.className="menu";
   const cell=(k,name,sub,ok)=>`<button data-k="${k}" class="${ok?"":"cd"}"><span>${name}</span><small>${sub}</small></button>`;
   menu.innerHTML=cell("basic","일반공격",`<span class="el">물리</span>데미지 ${dmgOf(null)}`,true)+
    ready.map(({s,ok},i)=>cell("s"+i,s.n,`<span class="el">${s.e&&ELEM[s.e]?ELEM[s.e].n:EFF[s.e]?EFF[s.e][0]:skillKind(s.t)}</span>${ok?(s.t==="hit"?"데미지 "+dmgOf(s):skillKind(s.t)):"쿨타임 "+s.cd+"턴"}`,ok)).join("")+
    `<button class="back" data-k="back">◀ 뒤로</button>`;
   menu.querySelectorAll("button").forEach(b=>{const k=b.dataset.k; let t;
    if(k==="back"){b.onclick=main;return}
    const showTip=()=>{const tip=$("tip");tip.innerHTML=tipFor(k);tip.classList.remove("hidden")};
    b.ontouchstart=()=>{t=setTimeout(showTip,450)}; b.ontouchend=()=>clearTimeout(t);
    b.onclick=()=>{
     if(k==="basic")return done({type:"basic",target:TARGET});
     const {s,ok}=ready[+k.slice(1)];
     if(!ok){showTip();setTimeout(()=>$("tip").classList.add("hidden"),1600);return}
     if(s.t==="hit"||s.t==="debuff")return done({type:"skill",skill:s,target:TARGET});
     done({type:"skill",skill:s,target:att});
    };
   });
  };
  const targets=()=>{
   menu.className="menu list";
   menu.innerHTML=alive(enemies).map(e=>`<button data-i="${ALL.indexOf(e)}" class="${e===TARGET?"pri":""}"><span>${e.name}</span><small>${ELEM[e.elem].n} · ${POW[e.pow][1]} · 체력 ${e.hp}/${e.maxhp}${(traitAdv(att,e)+elemAdv(att.elem,e.elem))?` · 상성 ${(traitAdv(att,e)+elemAdv(att.elem,e.elem))>0?"+":""}${traitAdv(att,e)+elemAdv(att.elem,e.elem)}%`:""}</small></button>`).join("")+`<button class="back" data-k="back">◀ 뒤로</button>`;
   menu.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(b.dataset.k==="back")return main();TARGET=ALL[+b.dataset.i];FOCUS.b=TARGET;markTargets(enemies);refresh();main()});
  };
  main();
 });
}
function markTargets(enemies){alive(enemies).forEach(e=>{const el=chipOf(e);if(!el)return;el.classList.add("cantgt");el.classList.toggle("tgt",e===TARGET);el.onclick=()=>{TARGET=e;FOCUS.b=e;alive(enemies).forEach(x=>chipOf(x)?.classList.toggle("tgt",x===e));refresh();const t=$("menu").querySelector('[data-k="target"] small');if(t)t.textContent=e.name}})}
function clearTargets(){ALL.forEach(f=>{const el=chipOf(f);if(el){el.classList.remove("cantgt","tgt");el.onclick=null}})}
/* 진행 */
async function loop(){
 let step=0;
 while(step<400&&alive(TA).length&&alive(TB).length){
  step++;
  alive(ALL).forEach(f=>f.gauge+=speed(f)); refresh(); await sleep(200);
  const ready=alive(ALL).filter(f=>f.gauge>=TURN).sort((a,b)=>b.gauge-a.gauge||rnd()-0.5);
  for(const f of ready){
   if(f.hp<=0)continue;
   const enemies=f.side==="a"?TB:TA; if(!alive(enemies).length)break;
   say(null,`${f.name} 차례`,"r"); f.gauge=0; FOCUS[f.side]=f; ACTOR=f; refresh();
   if(!startTurn(f)){refresh();continue}
   const no=cannotAct(f);
   if(no){say(f.side,no);playSt(f,f.eff.stun?"stun":f.eff.frost?"frost":f.eff.sleep?"sleep":"shock");endTurn(f);refresh();await sleep(700);continue}
   let action;
   if((MODE==="manual"&&f.side==="a")||MODE==="both"){refresh();action=await askPlayer(f,enemies)}
   else{await sleep(380);action=aiDecide(f,enemies)}
   if(action.target&&action.target.side!==f.side){FOCUS[action.target.side]=action.target;refresh();await sleep(120)}
   const attacks=action.type==="basic"||(action.type==="skill"&&(action.skill.t==="hit"||action.skill.t==="debuff")&&action.target&&action.target.side!==f.side);
   if(attacks)await lunge(f);
   perform(f,action); endTurn(f); refresh(); await sleep(attacks?620:520); ACTOR=null; refresh();
   if(!alive(TA).length||!alive(TB).length)break;
  }
 }
 finish();
}
/* 전투 화면: 지금 행동하는 내 소환수와 대상 적을 크게, 나머지는 작은 칩으로 */

function drawField(){

}
let SHOWN={a:null,b:null};
function refresh(){
 for(const side of ["a","b"]){
  const f=FOCUS[side]; if(!f)continue;
  const sp=$(side==="a"?"m_sp":"e_sp"), box=side==="a"?"m":"e";
  if(SHOWN[side]!==f){sp.innerHTML=`<div>${artWithImage(f.race,f.stage,null)}</div>`;SHOWN[side]=f}
  $(box+"_nm").textContent=f.name; $(box+"_lv").textContent=`Lv.${f.stage} ${ELEM[f.elem].n}`;
  const bar=$(box+"_hp"); bar.style.width=Math.max(0,f.hp/f.maxhp*100)+"%"; bar.className=hpClass(f); $(box+"_tg").style.width=Math.min(100,f.gauge/TURN*100)+"%";
  $(box+"_hpn").textContent=`${f.hp} / ${f.maxhp}`;
  $(box+"_eff").innerHTML=effHTML(f);
  sp.classList.toggle("down",f.hp<=0); sp.classList.toggle("act",ACTOR===f);
 }
 ALL.forEach(f=>{const c=chipOf(f);if(!c)return;c.textContent=f.hp<=0?"○":"●";c.classList.toggle("down",f.hp<=0);c.classList.toggle("on",FOCUS[f.side]===f)});
}

 const names=t=>t.map(f=>f.name).join("·");
 $("skbar").classList.add("hidden");
 let drop="", p="", pts="";
 if(GAME==="dungeon"){
  if(win==="a"){
   if((rec().dungeon||0)<FLOOR)setRec("dungeon",FLOOR);
   const kind=floorReward(FLOOR);
   if(claimedToday(FLOOR))p=`${FLOOR}층 통과. 오늘 보상은 이미 받았어요.`;
   else{p=`${FLOOR}층 통과.`;const c=rec().claimed||{};c[FLOOR]=todayStr();setRec("claimed",c);
    if(!fragOnly(FLOOR)&&Math.random()<STONE_DROP){addItem(kind,1);drop=`<div class="drop"><img src="img/item_stone${kind==="low"?2:3}.png" alt="">${STONE[kind][0]} ×1</div>`}
    else{addItem(kind+"frag",1);drop=`<div class="drop"><img src="img/item_frag${kind==="low"?2:3}.png" alt="">${STONE[kind+"frag"][0]} ×1</div>`}}
  }else p=`${FLOOR}층 몬스터에게 졌어요.`;
  addRecord({t:Date.now(),o:FLOOR+"층",w:win==="a",a:names(TA),b:names(TB),m:"dungeon"});
 }else{
  if(win==="a"){setRec("wins",(rec().wins||0)+1);setRec("streak",(rec().streak||0)+1);if(CUR_OPPO)markBeaten(CUR_OPPO)}
  else if(win==="b"){setRec("losses",(rec().losses||0)+1);setRec("streak",0)}
  const before=score(), r=Math.min(2,Math.max(.5,deckPower(OPPO.d)/Math.max(1,deckPower(PARTY.map(c=>[c,getStage(c)]))))), q=Math.sqrt(r);
  const dlt=win==="a"?Math.round(20*q):win==="b"?-Math.round(15/q):0; const after=Math.max(0,before+dlt); setRec("score",after);
  pts=`<div class="pts ${dlt>=0?"up":"down"}"><b>${dlt>0?"+":""}${after-before}</b><small>승점 ${before} → ${after}</small></div>`;
  p=win==="a"?`${OPP_NAME}의 방어덱을 이겼어요.`:win==="b"?`${OPP_NAME}의 방어덱에 졌어요.`:"둘 다 쓰러졌어요.";
  addRecord({t:Date.now(),o:OPP_NAME,w:win==="a",a:names(TA),b:names(TB)});
 }
 $("r_h").textContent=win==="a"?"승리":win==="b"?"패배":"무승부"; $("r_h").classList.toggle("lose",win!=="a");

 $("r_next").classList.toggle("hidden",!(GAME==="dungeon"&&win==="a"&&FLOOR<MAXFLOOR));

 BUSY=false;

function addRecord(r){const a=rec().log||[];a.unshift(r);setRec("log",a.slice(0,30))}
function listState(){let s={};try{s=JSON.parse(localStorage.getItem("ssm_arena")||"{}")}catch(e){}if(!s.seed){s={seed:String(Date.now()),t:Date.now(),beat:[]};saveList(s)}return s}

function markBeaten(key){const s=listState();if(!s.beat.includes(key))s.beat.push(key);saveList(s)}
function canRefresh(){return Date.now()-listState().t>=REFRESH_MS}

const BOT_NAMES=["검은달","하루","도토리","미르","루나","태오","보라","설희","제이","민트","가온","수호"];
function botDecks(){
 const r=rng(hash("bots"+listState().seed));
 const keys=Object.keys(JOBS);
 return Array.from({length:8},(_,i)=>{
  const n=BOT_NAMES[Math.floor(r()*BOT_NAMES.length)]+String(Math.floor(r()*90)+10);
  const size=1+Math.floor(r()*3);
  const d=Array.from({length:size},()=>{const b={y:String(1900+Math.floor(r()*200)),m:String(1+Math.floor(r()*12)),d:String(1+Math.floor(r()*28)),h:String(Math.floor(r()*12))};const a=Array.from({length:6},()=>keys[Math.floor(r()*keys.length)]);const st=r()<0.5?1:r()<0.75?2:3;return [encode(b,a,n),st]});
  return {n,d,bot:true,key:"b"+i};
 });
}
function deckPower(d){return d.reduce((s,[c,st])=>{const dd=decode(c);const R=judge(dd.b,dd.a);return s+power(stageStats(R.base,R.race,st-1))},0)}

function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));return s>=3600?`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`:`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}

  el.onclick=()=>{const c=el.dataset.c;if(PARTY.includes(c))PARTY=PARTY.filter(x=>x!==c);else if(PARTY.length<3)PARTY.push(c);else{toast("3마리까지만 데려갈 수 있어요");return}drawSetup()};
 });
 $("my_tri").querySelectorAll(".pt[data-c]").forEach(el=>{el.querySelector(".i").onclick=(ev)=>{ev.stopPropagation();openDetail(el.dataset.c,+el.dataset.s)};el.onclick=()=>{PARTY=PARTY.filter(x=>x!==el.dataset.c);drawSetup()}});
 $("op_tri").querySelectorAll(".pt[data-c]").forEach(el=>el.onclick=()=>openDetail(el.dataset.c,+el.dataset.s));
}
/* 상세 팝업 */
function openDetail(c,st){
 const d=decode(c); const R=judge(d.b,d.a); const f=makeFighter({d,h:c},st,"x",0);
 $("d_ttl").innerHTML=`${nameOf(R,st)} <b>${st}단계</b>`;
 $("d_art").innerHTML=`<div class="stars">전투력 ${power(f.st)}</div>${artWithImage(R.race,st,R.elem)}<div class="ty">${ELEM[R.elem].n} · ${POW[R.pow][1]}${d.nick?" · "+d.nick:""}</div>`;
 const stt=f.st;
 $("d_st").innerHTML=STN.map((n,i)=>`<span style="color:var(--ink2)">${n}</span><span>${i===0?stt[0]*10:stt[i]}</span>`).join("")+`<span style="color:var(--ink2)">속도</span><span>${speed(f)}</span>`;
 const dmgOf=(s)=>showDmg(MAGICAL.has(R.pow)&&s?stt[2]:stt[1],s?s.m:f.basic);
 $("d_sks").innerHTML=f.skills.map(s=>`<div class="skr"><div class="h"><b>${s.n}</b><span class="el">${s.e&&ELEM[s.e]?ELEM[s.e].n:s.e&&EFF[s.e]?EFF[s.e][0]:skillKind(s.t)}</span><small>${s.tier}단계 · 쿨타임 ${s.tier}턴</small></div><p>${(s.e&&EFF[s.e]?(s.d||"").replace(new RegExp("\\s*"+EFF[s.e][0]+"\\.$"),""):(s.d||""))}${s.t==="hit"?` 데미지 ${dmgOf(s)}.`:""}${s.e&&EFF[s.e]?` ${EFF[s.e][0]}: ${EFF[s.e][1]}`:""}</p></div>`).join("");
 $("detail").classList.remove("hidden");
}
$("d_x").onclick=()=>{$("detail").classList.add("hidden");$("tip").classList.add("hidden")};
$("detail").onclick=(e)=>{if(e.target===$("detail"))$("d_x").onclick()};
/* 전투 시작 */
async function run(){
 if(BUSY)return;
 if(!PARTY.length){toast("내 소환수를 하나는 골라야 해요");return}
 if(GAME==="arena"){if(!useArenaTicket()){toast("입장권이 없어요. "+fmtT(arenaTickets().next)+" 뒤에 1장 차요");return}drawAtk()}
 BUSY=true;
 const a=PARTY.map(c=>({h:{d:decode(c),h:c},stage:getStage(c)}));
 TA=a.map((x,i)=>makeFighter(x.h,x.stage,"a",i));
 TB=GAME==="dungeon"?Array.from({length:floorEnemyCount(FLOOR)},(_,i)=>makeMonster(FLOOR,i)):OPPO.d.map(([c,st],i)=>makeFighter({d:decode(c),h:c},st,"b",i));
 ALL=[...TA,...TB];
 rnd=rng(hash(ALL.map(x=>x.code+x.stage).join("|")+Date.now()));
 $("setup").classList.add("hidden");$("lobby").classList.add("hidden");$("fight").classList.remove("hidden");$("result").classList.add("hidden");
 $("fight").className="scene "+(GAME==="dungeon"?"bg-dungeon":"bg-arena");
 drawField(); $("log").innerHTML=""; $("cap").textContent=`${TB.map(f=>f.name).join("·")}${iga(TB[TB.length-1].name)} 나타났다!`;
 $("c_auto").classList.remove("hidden"); $("c_auto").classList.toggle("on",MODE==="auto"); $("c_auto").textContent="자동";
 await loop();
}
$("start").onclick=run;
$("cancel").onclick=()=>{$("setup").classList.add("hidden");if(GAME==="arena"||GAME==="dungeon")openList(LTAB)};
$("modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;$("modes").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))});
$("c_spd").onclick=()=>{SPD=SPD===1?2:SPD===2?3:1;$("c_spd").textContent="속도 ×"+SPD};
$("c_log").onclick=()=>{LOGON=!LOGON;$("log").classList.toggle("hidden",!LOGON);$("c_log").classList.toggle("on",LOGON)};
$("c_auto").onclick=()=>{MODE=MODE==="auto"?"manual":"auto";$("c_auto").classList.toggle("on",MODE==="auto");toast(MODE==="auto"?"자동 전투를 켰어요":"자동 전투를 껐어요. 다음 내 차례부터 직접 골라요")};
$("r_ok").onclick=()=>{$("result").classList.add("hidden");$("fight").classList.add("hidden");$("lobby").classList.remove("hidden");drawLobby();openList(LTAB)};
$("r_next").onclick=()=>{$("result").classList.add("hidden");$("fight").classList.add("hidden");$("lobby").classList.remove("hidden");FLOOR=Math.min(MAXFLOOR,FLOOR+1);OPP_NAME=FLOOR+"층";openSetup()};
$("list_x").onclick=()=>{$("list").classList.add("hidden");clearInterval(LIST_TIMER)};
$("ltabs").querySelectorAll("button").forEach(b=>b.onclick=()=>openList(b.dataset.t));
$("refresh").onclick=()=>{if(!canRefresh())return;refreshList()};
$("btn_go").onclick=()=>openList("match");
$("btn_rival").onclick=()=>openList(GAME==="dungeon"?"match":"rival");
$("bb_rec").onclick=()=>openList("rec");
$("bb_info").onclick=()=>openList("rank");
/* 방어덱 편집: 대전 준비 화면을 재사용 */
let DEFMODE=false;
$("bb_def").onclick=()=>{
 if(GAME==="dungeon"){location.href="index.html#colsec";return}
 DEFMODE=true; const saved=PARTY.slice(); PARTY=defDeck().filter(c=>col().includes(c));
 $("setup").classList.remove("hidden"); $("setup_ttl").innerHTML=`<b>방어덱 등록</b>`; $("setup_sub").textContent="다른 소환사가 이 덱과 싸워요"; $("op_lab").textContent="공격해 오는 소환사"; document.querySelector(".lab.me").textContent="내 방어덱"; $("modes").classList.add("hidden");
 $("start").textContent="저장"; $("cancel").textContent="취소";
 const back=()=>{DEFMODE=false;document.querySelector(".lab.me").textContent="내 공격덱";PARTY=saved;$("start").textContent="전투시작";$("cancel").textContent="전투취소";$("modes").classList.remove("hidden");$("setup").classList.add("hidden");$("start").onclick=run;$("cancel").onclick=cancelSetup;drawLobby()};
 $("start").onclick=()=>{if(!PARTY.length){toast("방어덱에 소환수를 하나는 넣어 주세요");return}setDefDeck(PARTY.slice());toast("방어덱을 저장했어요");back()};
 $("cancel").onclick=back;
 OPPO={d:[]}; drawSetup(); $("op_tri").innerHTML=Array.from({length:3},()=>`<div class="pt empty">?</div>`).join("");
};
function cancelSetup(){$("setup").classList.add("hidden");openList(LTAB)}
$("cancel").onclick=cancelSetup;

/* 효과 설명 창 */
function openGloss(){
 const row=(n,d,cls)=>`<div class="skr ${cls||""}"><div class="h"><b>${n}</b></div><p>${d}</p></div>`;
 const keys=Object.keys(EFF);
 $("g_body").innerHTML=`<div class="gl"><h4>상대에게 거는 효과</h4>${keys.filter(k=>BAD.has(k)).map(k=>row(EFF[k][0],EFF[k][1],"bad")).join("")}<h4>나를 돕는 효과</h4>${keys.filter(k=>!BAD.has(k)&&k!=="random").map(k=>row(EFF[k][0],EFF[k][1],"good")).join("")}<h4>그 밖에</h4>${row("방어","그 턴에 받는 피해가 "+GUARD*100+"% 줄어요.")}${row("회피","공격을 피해서 피해를 받지 않아요. 속박에 걸리면 피하지 못해요.")}${row("빗나감","실명 상태에서 공격이 빗나간 거예요.")}${row("상성 유리 · 불리","속성끼리 맞물려서 피해가 조금 늘거나 줄어요.")}</div>`;
 $("gloss").classList.remove("hidden"); PAUSED=true;
}
$("c_help").onclick=openGloss;
const closeGloss=()=>{$("gloss").classList.add("hidden");PAUSED=false};
$("g_x").onclick=closeGloss;
$("gloss").onclick=(e)=>{if(e.target===$("gloss"))closeGloss()};
$("e_eff").onclick=openGloss; $("m_eff").onclick=openGloss;
/* 시작 */
(function(){
 const q=new URLSearchParams(location.search);
 if(GAME==="dungeon"){$("tab_d").classList.add("on");document.querySelector('#ltabs [data-t="rival"]').classList.add("hidden");document.querySelector('#ltabs [data-t="match"]').textContent="층 선택";$("btn_go").textContent="입장하기";$("btn_rival").classList.add("hidden");$("bb_def").textContent="소환수";document.title="던전";$("lobby").className="scene bg-dungeon"}
 else $("tab_a").classList.add("on");
 const c=col(); if(c.length)PARTY=[c[c.length-1]];
 drawLobby();
 const f=q.get("f"); if(f!=null&&friendsV2()[+f]){const o={...friendsV2()[+f],key:"f"+f};OPPO=o;CUR_OPPO=o.key;OPP_NAME=o.n||"소환사";LTAB="rival";openSetup()}
 if(GAME==="arena"){const tick=()=>{const left=REFRESH_MS-(Date.now()-listState().t);$("lobby_timer").textContent=left>0?"리스트 갱신까지 "+fmtT(left):"리스트 갱신 가능";drawAtk()};tick();setInterval(tick,1000)}else $("atk_row").classList.add("hidden");
})();
</script>
</body>
